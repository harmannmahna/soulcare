          REQUIRED: true
          LOCATION: path
          FORMAT: uuid
      - limit:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 25
          MINIMUM: 1
          MAXIMUM: 100
      - skip:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 0
          MINIMUM: 0
      - status:
