      REQUIRED: false
    - name: onlyMainContent
      TYPE: BOOL
      REQUIRED: false
      DEFAULT: true
      comment: Only return the main content of the page excluding headers, navs, footers, etc. This is a deterministic HTML-level filter applied before markdown is generated; no LLM is involved.
    - name: onlyCleanContent
      TYPE: BOOL
      REQUIRED: false
      DEFAULT: false
      comment: Beta. Run an additional LLM-based pass over the generated markdown to remove residual boilerplate that `onlyMainContent` can miss (cookie banners, ad blocks, social share widgets, breadcrumbs, newsletter signups, comment sections, related-article lists). Headings, lists, tables, code blocks, image references, and inline links are preserved. Can be combined with `onlyMainContent` (the most common setup) or used on its own. Skipped with a warning when the markdown exceeds the cleaning model's output token limit (the original markdown is preserved). Not supported on zero-data-retention requests.
    - name: includeTags
      TYPE: "[]STRING"
      REQUIRED: false
      comment: Tags to include in the output.
    - name: excludeTags
      TYPE: "[]STRING"
      REQUIRED: false
      comment: Tags to exclude from the output.
    - name: maxAge
      TYPE: INT
      REQUIRED: false
      DEFAULT: 172800000
      comment: Returns a cached version of the page if it is younger than this age in milliseconds. If a cached version of the page is older than this value, the page will be scraped. If you do not need extremely fresh data, enabling this can speed up your scrapes by 500%. Defaults to 2 days.
    - name: minAge
      TYPE: INT
      REQUIRED: false
      comment: When set, the request only checks the cache and never triggers a fresh scrape. The value is in milliseconds and specifies the minimum age the cached data must be. If matching cached data exists, it is returned instantly. If no cached data is found, a 404 with error code SCRAPE_NO_CACHED_DATA is returned. Set to 1 to accept any cached data regardless of age.
    - name: headers
      TYPE: STRUCT(ScrapeOptions_headers)
      REQUIRED: false
      comment: Headers to send with the request. Can be used to send cookies, user-agent, etc.
    - name: waitFor
      TYPE: INT
      REQUIRED: false
      DEFAULT: 0
      comment: Specify a delay in milliseconds before fetching the content, allowing the page sufficient time to load. This waiting time is in addition to Firecrawl's smart wait feature.
    - name: mobile
      TYPE: BOOL
      REQUIRED: false
      DEFAULT: false
      comment: Set to true if you want to emulate scraping from a mobile device. Useful for testing responsive pages and taking mobile screenshots.
    - name: skipTlsVerification
      TYPE: BOOL
      REQUIRED: false
      DEFAULT: true
      comment: Skip TLS certificate verification when making requests.
    - name: timeout
      TYPE: INT
      REQUIRED: false
      MINIMUM: 1000
      MAXIMUM: 300000
      DEFAULT: 60000
      comment: Timeout in milliseconds for the request. Minimum is 1000 (1 second). Default is 60000 (60 seconds). Maximum is 300000 (300 seconds).
    - name: parsers
      TYPE: "[]STRUCT(ScrapeOptions_parsers_Item)"
      REQUIRED: false
      DEFAULT:
        - pdf
      comment: Controls how files are processed during scraping. When "pdf" is included (default), the PDF content is extracted and converted to markdown format, with billing based on the number of pages (1 credit per page). When an empty array is passed, the PDF file is returned in base64 encoding with a flat rate of 1 credit for the entire PDF.
    - name: actions
      TYPE: "[]STRUCT(ScrapeOptions_actions_Item)"
      REQUIRED: false
      comment: Actions to perform on the page before grabbing the content
    - name: location
      TYPE: STRUCT(ScrapeOptions_location)
      REQUIRED: false
      comment: Location settings for the request. When specified, this will use an appropriate proxy if available and emulate the corresponding language and timezone settings. Defaults to 'US' if not specified.
    - name: removeBase64Images
      TYPE: BOOL
      REQUIRED: false
      DEFAULT: true
      comment: Removes all base 64 images from the markdown output, which may be overwhelmingly long. This does not affect html or rawHtml formats. The image's alt text remains in the output, but the URL is replaced with a placeholder.
    - name: blockAds
      TYPE: BOOL
      REQUIRED: false
      DEFAULT: true
      comment: Enables ad-blocking and cookie popup blocking.
    - name: proxy
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - basic
        - enhanced
        - auto
      DEFAULT: auto
      comment: |-
        Specifies the type of proxy to use.

         - **basic**: Proxies for scraping sites with none to basic anti-bot solutions. Fast and usually works.
         - **enhanced**: Enhanced proxies for scraping sites with advanced anti-bot solutions. Slower, but more reliable on certain sites. Billed at the same credit cost as basic.
         - **auto**: Firecrawl will automatically retry scraping with enhanced proxies if the basic proxy fails. Enhanced proxies carry no credit surcharge, so either way only the regular cost is billed.
    - name: storeInCache
      TYPE: BOOL
      REQUIRED: false
      DEFAULT: true
      comment: If true, the page will be stored in the Firecrawl index and cache. Setting this to false is useful if your scraping activity may have data protection concerns. Using some parameters associated with sensitive scraping (e.g. actions, headers) will force this parameter to be false.
    - name: lockdown
      TYPE: BOOL
      REQUIRED: false
      DEFAULT: false
      comment: If true, serves the request from Firecrawl's cache only and never makes an outbound request to the target URL. Designed for compliance-constrained or air-gapped environments where the scrape request itself could leak sensitive information. On cache miss, returns a 404 with error code SCRAPE_LOCKDOWN_CACHE_MISS (the URL is never logged on miss). Lockdown requests are treated as zero data retention. Default maxAge is extended to 2 years so existing cached pages remain eligible. Billed at 5 credits on hit, 1 credit on cache miss.
    - name: redactPII
      TYPE: STRUCT(ScrapeOptions_redactPII)
      REQUIRED: false
      DEFAULT: false
      comment: Redact personally identifiable information from returned markdown. Pass `true` to use defaults, or an object to tune mode, entities, and replacement style.
    - name: profile
      TYPE: STRUCT(ScrapeOptions_profile)
      REQUIRED: false
      comment: Enable persistent browser storage across scrape and interact sessions. Pass a profile when scraping to preserve cookies, localStorage, and session data. Sessions with the same profile name share browser state.
    - name: threatProtection
      TYPE: STRUCT(ThreatProtectionOverride)
      REQUIRED: false
    - name: auditMetadata
      TYPE: STRUCT(AuditMetadata)
      REQUIRED: false
