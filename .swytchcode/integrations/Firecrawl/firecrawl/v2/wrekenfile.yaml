  getThreatProtection_get_team_threat_protection_731db266Response200_data:
    - name: mode
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - "off"
        - normal
      EXAMPLE: normal
      comment: Threat protection mode. `off` disables checks; `normal` checks URLs against Google Web Risk (+2 credits per URL scanned).
    - name: riskScoreThreshold
      TYPE: INT
      REQUIRED: false
      MINIMUM: 0
      MAXIMUM: 100
      EXAMPLE: 75
      comment: Normalized score (0-100) at or above which a classifier verdict is blocked. Lower is stricter.
    - name: blacklist
      TYPE: "[]STRING"
      REQUIRED: false
      EXAMPLE:
        - "*.risky.example"
      comment: Exact domains or globs (e.g. `*.example.com`) always blocked, without a classifier call.
    - name: whitelist
      TYPE: "[]STRING"
      REQUIRED: false
      EXAMPLE:
        - "*.trusted.example"
      comment: Exact domains or globs always allowed. Wins over every other rule.
    - name: blockedTlds
      TYPE: "[]STRING"
      REQUIRED: false
      EXAMPLE:
        - zip
      comment: Top-level domains to block outright, lowercase without a leading dot.
    - name: failurePolicy
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - open
        - closed
      EXAMPLE: closed
      comment: "Behavior when the classifier is unreachable: `closed` blocks (default), `open` allows."
    - name: allowRequestOverrides
      TYPE: BOOL
      REQUIRED: false
      EXAMPLE: true
      comment: Whether individual requests may pass a `threatProtection` object. When false, such requests are rejected with 403.
    - name: configured
      TYPE: BOOL
      REQUIRED: false
      EXAMPLE: true
      comment: Whether the organization has saved a policy (vs. serving defaults).
