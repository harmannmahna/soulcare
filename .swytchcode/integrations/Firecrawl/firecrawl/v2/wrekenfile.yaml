      REQUIRED: false
      ENUM:
        - high
        - medium
        - low
    - name: reason
      TYPE: STRING
      REQUIRED: false
    - name: meaningfulChanges
      TYPE: "[]STRUCT(MonitorPageJudgment_meaningfulChanges_Item)"
      REQUIRED: false
      comment: Goal-relevant changes selected by the judge from the page diff.
