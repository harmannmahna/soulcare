STRUCTS:
  AuditMetadata:
    - name: username
      TYPE: STRING
      REQUIRED: true
      MAX_LENGTH: 1024
      comment: The username associated with the request.
  SuccessResponse:
    - name: success
      TYPE: BOOL
      REQUIRED: false
      EXAMPLE: true
  MonitorSchedule:
    - name: cron
      TYPE: STRING
      REQUIRED: false
      EXAMPLE: "*/30 * * * *"
      comment: Five-field cron expression. Minimum interval is 5 minutes.
    - name: text
      TYPE: STRING
      REQUIRED: false
      EXAMPLE: every 30 minutes
      comment: Natural language schedule. Supported examples include `every 30 minutes`, `every 15 minutes starting at :07`, `hourly`, `every 2 hours`, `daily`, `daily at 9:00`, `daily at 9am`, `daily at 5:30 PM`, and `weekly`.
    - name: timezone
      TYPE: STRING
      REQUIRED: false
      DEFAULT: UTC
      EXAMPLE: UTC
      comment: IANA timezone for the schedule.
  MonitorWebhook:
    - name: url
      TYPE: STRING
      REQUIRED: true
      FORMAT: uri
      comment: The URL to send monitor webhooks to.
    - name: headers
      TYPE: map[STRING]STRING
      REQUIRED: false
      comment: Headers to send to the webhook URL.
    - name: metadata
      TYPE: map[STRING]ANY
      REQUIRED: false
      comment: Custom metadata included in webhook payloads.
    - name: events
      TYPE: "[]STRING"
      REQUIRED: false
      comment: Monitor webhook events to receive. Defaults to all monitor events.
  MonitorNotification_email:
    - name: enabled
      TYPE: BOOL
      REQUIRED: false
      DEFAULT: false
    - name: recipients
      TYPE: "[]STRING"
      REQUIRED: false
      MAX_ITEMS: 25
    - name: includeDiffs
      TYPE: BOOL
      REQUIRED: false
      DEFAULT: false
      comment: Include changed page details in email summaries.
  MonitorNotification:
    - name: email
      TYPE: STRUCT(MonitorNotification_email)
      REQUIRED: false
  MonitorTarget_variant_0:
    - name: id
      TYPE: STRING
      REQUIRED: false
      FORMAT: uuid
      comment: Optional stable ID for this target. Generated if omitted.
    - name: type
      TYPE: STRING
      REQUIRED: true
      ENUM:
        - scrape
    - name: urls
      TYPE: "[]STRING"
      REQUIRED: true
      MIN_ITEMS: 1
    - name: scrapeOptions
      TYPE: STRUCT(ScrapeOptions)
      REQUIRED: false
  MonitorTarget_variant_1_crawlOptions:
    - name: value
      TYPE: ANY
      REQUIRED: false
  MonitorTarget_variant_1:
    - name: id
      TYPE: STRING
      REQUIRED: false
      FORMAT: uuid
      comment: Optional stable ID for this target. Generated if omitted.
    - name: type
      TYPE: STRING
      REQUIRED: true
      ENUM:
        - crawl
    - name: url
      TYPE: STRING
      REQUIRED: true
      FORMAT: uri
    - name: crawlOptions
      TYPE: STRUCT(MonitorTarget_variant_1_crawlOptions)
      REQUIRED: false
      comment: Crawl options such as `limit`, `maxDepth`, `includePaths`, and `excludePaths`.
    - name: scrapeOptions
      TYPE: STRUCT(ScrapeOptions)
      REQUIRED: false
  MonitorTarget_variant_2:
    - name: id
      TYPE: STRING
      REQUIRED: false
      FORMAT: uuid
      comment: Optional stable ID for this target. Generated if omitted.
    - name: type
      TYPE: STRING
      REQUIRED: true
      ENUM:
        - search
    - name: queries
      TYPE: "[]STRING"
      REQUIRED: true
      MIN_ITEMS: 1
      MAX_ITEMS: 12
      comment: Search queries to run on each check (1-12).
    - name: searchWindow
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - 5m
        - 15m
        - 1h
        - 6h
        - 24h
        - 7d
      DEFAULT: 24h
      comment: Recency filter — only consider results published within this window.
    - name: maxResults
      TYPE: INT
      REQUIRED: false
      MINIMUM: 1
      MAXIMUM: 50
      DEFAULT: 10
      comment: Total results to evaluate per check, merged and deduped across all queries (a combined cap, not per-query).
    - name: includeDomains
      TYPE: "[]STRING"
      REQUIRED: false
      MAX_ITEMS: 50
      comment: Optional. Restrict results to these domains.
    - name: excludeDomains
      TYPE: "[]STRING"
      REQUIRED: false
      MAX_ITEMS: 50
      comment: Optional. Drop results from these domains.
  MonitorTarget:
    - name: _COMPOSITION
      TYPE: ONE_OF
      REQUIRED: false
    - name: variant_0
      TYPE: STRUCT(MonitorTarget_variant_0)
      REQUIRED: false
    - name: variant_1
      TYPE: STRUCT(MonitorTarget_variant_1)
      REQUIRED: false
    - name: variant_2
      TYPE: STRUCT(MonitorTarget_variant_2)
      REQUIRED: false
  MonitorCreateRequest:
    - name: name
      TYPE: STRING
      REQUIRED: true
      MAX_LENGTH: 256
    - name: schedule
      TYPE: STRUCT(MonitorSchedule)
      REQUIRED: true
    - name: webhook
      TYPE: STRUCT(MonitorWebhook)
      REQUIRED: false
    - name: notification
      TYPE: STRUCT(MonitorNotification)
      REQUIRED: false
    - name: targets
      TYPE: "[]STRUCT(MonitorTarget)"
      REQUIRED: true
      MIN_ITEMS: 1
      MAX_ITEMS: 50
    - name: retentionDays
      TYPE: INT
      REQUIRED: false
      MINIMUM: 1
      MAXIMUM: 365
      DEFAULT: 30
    - name: goal
      TYPE: STRING
      REQUIRED: false
      MAX_LENGTH: 2000
      NULLABLE: true
      comment: Plain-language goal used to judge whether changed pages are meaningful. If provided and `judgeEnabled` is omitted, judging is enabled automatically. Required (non-empty) when any target is a `search` target, unless `judgeEnabled` is `false`.
    - name: judgeEnabled
      TYPE: BOOL
      REQUIRED: false
      comment: Whether to judge changed pages against `goal`. Requires a non-empty `goal` to run.
  MonitorUpdateRequest:
    - name: name
      TYPE: STRING
      REQUIRED: false
      MAX_LENGTH: 256
    - name: schedule
      TYPE: STRUCT(MonitorSchedule)
      REQUIRED: false
    - name: webhook
      TYPE: STRUCT(MonitorWebhook)
      REQUIRED: false
    - name: notification
      TYPE: STRUCT(MonitorNotification)
      REQUIRED: false
    - name: targets
      TYPE: "[]STRUCT(MonitorTarget)"
      REQUIRED: false
      MIN_ITEMS: 1
      MAX_ITEMS: 50
    - name: retentionDays
      TYPE: INT
      REQUIRED: false
      MINIMUM: 1
      MAXIMUM: 365
    - name: goal
      TYPE: STRING
      REQUIRED: false
      MAX_LENGTH: 2000
      NULLABLE: true
      comment: Plain-language goal used to judge whether changed pages are meaningful. If provided and `judgeEnabled` is omitted, judging is enabled automatically. Required (non-empty) when any target is a `search` target, unless `judgeEnabled` is `false`.
    - name: judgeEnabled
      TYPE: BOOL
      REQUIRED: false
      comment: Whether to judge changed pages against `goal`. Requires a non-empty `goal` to run.
    - name: status
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - active
        - paused
  MonitorSummary:
    - name: totalPages
      TYPE: INT
      REQUIRED: false
    - name: same
      TYPE: INT
      REQUIRED: false
    - name: changed
      TYPE: INT
      REQUIRED: false
    - name: new
      TYPE: INT
      REQUIRED: false
    - name: removed
      TYPE: INT
      REQUIRED: false
    - name: error
      TYPE: INT
      REQUIRED: false
  Monitor_schedule:
    - name: cron
      TYPE: STRING
      REQUIRED: false
    - name: timezone
      TYPE: STRING
      REQUIRED: false
  Monitor:
    - name: id
      TYPE: STRING
      REQUIRED: false
      FORMAT: uuid
    - name: name
      TYPE: STRING
      REQUIRED: false
    - name: status
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - active
        - paused
        - deleted
    - name: schedule
      TYPE: STRUCT(Monitor_schedule)
      REQUIRED: false
    - name: nextRunAt
      TYPE: TIMESTAMP
      REQUIRED: false
      FORMAT: date-time
      NULLABLE: true
    - name: lastRunAt
      TYPE: TIMESTAMP
      REQUIRED: false
      FORMAT: date-time
      NULLABLE: true
    - name: currentCheckId
      TYPE: STRING
      REQUIRED: false
      FORMAT: uuid
      NULLABLE: true
    - name: targets
      TYPE: "[]STRUCT(MonitorTarget)"
      REQUIRED: false
    - name: webhook
      TYPE: STRUCT(MonitorWebhook)
      REQUIRED: false
    - name: notification
      TYPE: STRUCT(MonitorNotification)
      REQUIRED: false
    - name: retentionDays
      TYPE: INT
      REQUIRED: false
    - name: estimatedCreditsPerMonth
      TYPE: INT
      REQUIRED: false
      NULLABLE: true
      comment: Upper-bound monthly credit estimate. When judging is enabled, actual usage may be lower because judge credits are only charged for changed pages that are judged.
    - name: lastCheckSummary
      TYPE: STRUCT(MonitorSummary)
      REQUIRED: false
    - name: goal
      TYPE: STRING
      REQUIRED: false
      NULLABLE: true
    - name: judgeEnabled
      TYPE: BOOL
      REQUIRED: false
    - name: createdAt
      TYPE: TIMESTAMP
      REQUIRED: false
      FORMAT: date-time
    - name: updatedAt
      TYPE: TIMESTAMP
      REQUIRED: false
      FORMAT: date-time
  MonitorCheck_notificationStatus:
    - name: value
      TYPE: ANY
      REQUIRED: false
  MonitorCheck:
    - name: id
      TYPE: STRING
      REQUIRED: false
      FORMAT: uuid
    - name: monitorId
      TYPE: STRING
      REQUIRED: false
      FORMAT: uuid
    - name: status
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - queued
        - running
        - completed
        - failed
        - partial
        - skipped_overlap
    - name: trigger
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - scheduled
        - manual
    - name: scheduledFor
      TYPE: TIMESTAMP
      REQUIRED: false
      FORMAT: date-time
      NULLABLE: true
    - name: startedAt
      TYPE: TIMESTAMP
      REQUIRED: false
      FORMAT: date-time
      NULLABLE: true
    - name: finishedAt
      TYPE: TIMESTAMP
      REQUIRED: false
      FORMAT: date-time
      NULLABLE: true
    - name: estimatedCredits
      TYPE: INT
      REQUIRED: false
      NULLABLE: true
      comment: Upper-bound credits reserved for this check before Firecrawl knows how many pages changed and require judging.
    - name: reservedCredits
      TYPE: INT
      REQUIRED: false
      NULLABLE: true
    - name: actualCredits
      TYPE: INT
      REQUIRED: false
      NULLABLE: true
      comment: Final credits charged for this check after scrapes, crawls, and any changed-page judge calls complete.
    - name: billingStatus
      TYPE: STRING
      REQUIRED: false
    - name: summary
      TYPE: STRUCT(MonitorSummary)
      REQUIRED: false
    - name: targetResults
      TYPE: "[]ANY"
      REQUIRED: false
      NULLABLE: true
    - name: notificationStatus
      TYPE: STRUCT(MonitorCheck_notificationStatus)
      REQUIRED: false
      NULLABLE: true
    - name: error
      TYPE: STRING
      REQUIRED: false
      NULLABLE: true
    - name: createdAt
      TYPE: TIMESTAMP
      REQUIRED: false
      FORMAT: date-time
    - name: updatedAt
      TYPE: TIMESTAMP
      REQUIRED: false
      FORMAT: date-time
  MonitorCheckPage_metadata:
    - name: value
      TYPE: ANY
      REQUIRED: false
  MonitorCheckPage_diff_json:
    - name: value
      TYPE: ANY
      REQUIRED: false
  MonitorCheckPage_diff:
    - name: text
      TYPE: STRING
      REQUIRED: false
      comment: Unified markdown diff. Present on markdown-only and mixed-mode monitors.
    - name: json
      TYPE: STRUCT(MonitorCheckPage_diff_json)
      REQUIRED: false
      comment: "For markdown-only monitors, a parseDiff AST `{ files: [...] }`. For JSON-extraction (and mixed-mode) monitors, a per-field `{ previous, current }` map keyed by the JSON path into the extraction (e.g. `plans[0].price`)."
  MonitorCheckPage_snapshot_json:
    - name: value
      TYPE: ANY
      REQUIRED: false
  MonitorCheckPage_snapshot:
    - name: json
      TYPE: STRUCT(MonitorCheckPage_snapshot_json)
      REQUIRED: false
      comment: The full structured JSON extracted on this run, matching the schema/prompt declared on the target's `changeTracking` format.
  MonitorCheckPage:
    - name: id
      TYPE: STRING
      REQUIRED: false
      FORMAT: uuid
    - name: targetId
      TYPE: STRING
      REQUIRED: false
    - name: url
      TYPE: STRING
      REQUIRED: false
      FORMAT: uri
    - name: status
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - same
        - new
        - changed
        - removed
        - error
    - name: previousScrapeId
      TYPE: STRING
      REQUIRED: false
      FORMAT: uuid
      NULLABLE: true
    - name: currentScrapeId
      TYPE: STRING
      REQUIRED: false
      FORMAT: uuid
      NULLABLE: true
    - name: statusCode
      TYPE: INT
      REQUIRED: false
      NULLABLE: true
    - name: error
      TYPE: STRING
      REQUIRED: false
      NULLABLE: true
    - name: metadata
      TYPE: STRUCT(MonitorCheckPage_metadata)
      REQUIRED: false
      NULLABLE: true
      comment: "Extra per-page metadata. For search monitors this includes `searchStatus`, the finer-grained search disposition behind the top-level `status`: `alert` (maps to `new`), `already_seen`, `watching`, `ignored` (all map to `same`), or `skipped` (maps to `error`)."
    - name: judgment
      TYPE: STRUCT(MonitorPageJudgment)
      REQUIRED: false
    - name: diff
      TYPE: STRUCT(MonitorCheckPage_diff)
      REQUIRED: false
      NULLABLE: true
      comment: Inline diff artifact when the page changed. The shape depends on what the monitor's scrapeOptions.formats asked for. Markdown-only monitors populate both `text` (unified diff) and `json` (parseDiff AST). JSON-extraction monitors populate `json` as a per-field `{previous, current}` map keyed by JSON path. Mixed-mode monitors (`changeTracking` with both `json` and `git-diff` modes) populate both `text` (markdown sidecar) and `json` (per-field diff).
    - name: snapshot
      TYPE: STRUCT(MonitorCheckPage_snapshot)
      REQUIRED: false
      NULLABLE: true
      comment: Snapshot of the current JSON extraction at this run. Present on JSON-extraction and mixed-mode monitors; absent for markdown-only monitors.
    - name: createdAt
      TYPE: TIMESTAMP
      REQUIRED: false
      FORMAT: date-time
  MonitorPageJudgment_meaningfulChanges_Item:
    - name: type
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - added
        - removed
        - changed
    - name: before
      TYPE: STRING
      REQUIRED: false
      NULLABLE: true
    - name: after
      TYPE: STRING
      REQUIRED: false
      NULLABLE: true
    - name: reason
      TYPE: STRING
      REQUIRED: false
  MonitorPageJudgment:
