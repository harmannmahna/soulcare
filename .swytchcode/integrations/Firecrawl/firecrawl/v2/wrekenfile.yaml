VERSION: 2.0.2
DEFAULTS:
  bearer_token: BEARER <TOKEN>
  w_base_url: https://api.firecrawl.dev/v2
METHODS:
  firecrawl.monitor.create:
    SUMMARY: Create a monitor
    HTTP:
      METHOD: POST
      ENDPOINT: /monitor
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(MonitorCreateRequest)
    SECURITY:
      - bearerAuth:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(MonitorCreateRequest)
          REQUIRED: true
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(MonitorResponse)
        RETURNVAR: firecrawl_monitor_create
        STATUS: 200
    ERRORS:
      - TYPE: ANY
        STATUS: 400
        WHEN: Invalid monitor request (HTTP 400)
    CANONICAL_ID: firecrawl.monitor.create
  firecrawl.monitor.list:
    SUMMARY: List monitors
    HTTP:
      METHOD: GET
      ENDPOINT: /monitor
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - bearerAuth:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - limit:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 25
          MINIMUM: 1
          MAXIMUM: 100
      - offset:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 0
          MINIMUM: 0
    RETURNS:
      - RETURNTYPE: STRUCT(MonitorListResponse)
        RETURNVAR: firecrawl_monitor_list
        STATUS: 200
    CANONICAL_ID: firecrawl.monitor.list
  firecrawl.monitor.get:
    SUMMARY: Get a monitor
    HTTP:
      METHOD: GET
      ENDPOINT: /monitor/{monitorId}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - bearerAuth:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - monitorId:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
          FORMAT: uuid
    RETURNS:
      - RETURNTYPE: STRUCT(MonitorResponse)
        RETURNVAR: firecrawl_monitor_get
        STATUS: 200
    ERRORS:
      - TYPE: ANY
        STATUS: 404
        WHEN: Monitor not found (HTTP 404)
    CANONICAL_ID: firecrawl.monitor.get
  firecrawl.monitor.update:
    SUMMARY: Update a monitor
    HTTP:
      METHOD: PATCH
      ENDPOINT: /monitor/{monitorId}
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(MonitorUpdateRequest)
    SECURITY:
      - bearerAuth:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - monitorId:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
          FORMAT: uuid
      - body:
          TYPE: STRUCT(MonitorUpdateRequest)
          REQUIRED: true
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(MonitorResponse)
        RETURNVAR: firecrawl_monitor_update
        STATUS: 200
    ERRORS:
      - TYPE: ANY
        STATUS: 404
        WHEN: Monitor not found (HTTP 404)
    CANONICAL_ID: firecrawl.monitor.update
  firecrawl.monitor.delete:
    SUMMARY: Delete a monitor
    HTTP:
      METHOD: DELETE
      ENDPOINT: /monitor/{monitorId}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - bearerAuth:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - monitorId:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
          FORMAT: uuid
    RETURNS:
      - RETURNTYPE: STRUCT(SuccessResponse)
        RETURNVAR: firecrawl_monitor_delete
        STATUS: 200
    ERRORS:
      - TYPE: ANY
        STATUS: 404
        WHEN: Monitor not found (HTTP 404)
    CANONICAL_ID: firecrawl.monitor.delete
  firecrawl.run.create:
    SUMMARY: Run a monitor
    HTTP:
      METHOD: POST
      ENDPOINT: /monitor/{monitorId}/run
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - bearerAuth:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - monitorId:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
          FORMAT: uuid
    RETURNS:
      - RETURNTYPE: STRUCT(MonitorRunResponse)
        RETURNVAR: firecrawl_run_create
        STATUS: 200
    ERRORS:
      - TYPE: ANY
        STATUS: 409
        WHEN: A monitor check is already running (HTTP 409)
    CANONICAL_ID: firecrawl.run.create
  firecrawl.check.get:
    SUMMARY: List monitor checks
    HTTP:
      METHOD: GET
      ENDPOINT: /monitor/{monitorId}/checks
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - bearerAuth:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - monitorId:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
          FORMAT: uuid
      - limit:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 25
          MINIMUM: 1
          MAXIMUM: 100
      - offset:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 0
          MINIMUM: 0
      - status:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          ENUM:
            - queued
            - running
            - completed
            - failed
            - partial
            - skipped_overlap
    RETURNS:
      - RETURNTYPE: STRUCT(MonitorCheckListResponse)
