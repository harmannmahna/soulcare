          TYPE: STRING
          REQUIRED: true
          LOCATION: path
    ERRORS:
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 400
        WHEN: Could not delete the collection. See the error response for details. (HTTP 400)
      - TYPE: ANY
        STATUS: 401
