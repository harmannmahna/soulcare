      METHOD: POST
      ENDPOINT: /schema
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(Class)
    SECURITY:
      - {}
      - oidc:
          type: oauth2
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(Class)
          REQUIRED: true
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(Class)
        RETURNVAR: weaviate_schema_create
        STATUS: 200
    ERRORS:
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized or invalid credentials. (HTTP 401)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(RestrictionViolationResponse)
        STATUS: 422
        WHEN: Invalid collection definition provided. Check the definition structure and properties. (HTTP 422)
      - TYPE: STRUCT(UsageLimitExceededResponse)
        STATUS: 429
        WHEN: A configured usage limit (collections/shards) was exceeded. See the `UsageLimitExceededResponse` body for which limit and the configured value. (HTTP 429)
      - TYPE: STRUCT(ErrorResponse)
