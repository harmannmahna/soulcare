  weaviate.schema.update:
    SUMMARY: Update collection definition
    DESC: "Updates the configuration settings of an existing collection (`className`) based on the provided definition. Note: This operation modifies mutable settings specified in the request body. It does not add properties (use `POST /schema/{className}/properties` for that) or change the collection name."
