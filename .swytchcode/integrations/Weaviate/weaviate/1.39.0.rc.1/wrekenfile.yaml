    RETURNS:
      - RETURNTYPE: STRUCT(Class)
        RETURNVAR: weaviate_schema_update
        STATUS: 200
    ERRORS:
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized or invalid credentials. (HTTP 401)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 404
        WHEN: Collection not found. (HTTP 404)
      - TYPE: STRUCT(RestrictionViolationResponse)
        STATUS: 422
        WHEN: Invalid update attempt. (HTTP 422)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 500
        WHEN: An error occurred while updating the collection. Check the ErrorResponse for details. (HTTP 500)
    CANONICAL_ID: weaviate.schema.update
  weaviate.property.create:
    SUMMARY: Add a property to a collection
    DESC: Adds a new property definition to an existing collection (`className`) definition.
    HTTP:
      METHOD: POST
