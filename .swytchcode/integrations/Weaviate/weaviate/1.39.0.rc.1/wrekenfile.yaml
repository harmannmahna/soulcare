VERSION: 2.0.2
DEFAULTS:
  bearer_token: BEARER <ACCESS_TOKEN>
  w_base_url: https://{cluster_url}/v1
METHODS:
  weaviate.resource.execute:
    SUMMARY: List available endpoints
    DESC: Get links to other endpoints to help discover the REST API.
    HTTP:
      METHOD: GET
      ENDPOINT: /
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - {}
      - oidc:
          type: oauth2
    EXECUTION:
      KIND: http
      MODE: sync
    RETURNS:
      - RETURNTYPE: STRUCT(weaviate_root_23a58d2d_get_2b5d4Response200)
        RETURNVAR: weaviate_resource_execute
        STATUS: 200
    CANONICAL_ID: weaviate.resource.execute
  weaviate.live.list:
    SUMMARY: Check application liveness
    DESC: Indicates if the Weaviate instance is running and responsive to basic HTTP requests. Primarily used for health checks, such as Kubernetes liveness probes.
    HTTP:
      METHOD: GET
      ENDPOINT: /.well-known/live
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - {}
      - oidc:
          type: oauth2
    EXECUTION:
      KIND: http
      MODE: sync
    CANONICAL_ID: weaviate.live.list
  weaviate.ready.list:
    SUMMARY: Check application readiness
    DESC: Indicates if the Weaviate instance has completed its startup routines and is prepared to accept user traffic (data import, queries, etc.). Used for readiness checks, such as Kubernetes readiness probes.
    HTTP:
      METHOD: GET
      ENDPOINT: /.well-known/ready
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - {}
      - oidc:
          type: oauth2
    EXECUTION:
      KIND: http
      MODE: sync
    ERRORS:
      - TYPE: ANY
        STATUS: 503
        WHEN: The application is not ready to serve traffic. Traffic should be directed to other available replicas if applicable. (HTTP 503)
    CANONICAL_ID: weaviate.ready.list
  weaviate.openid_configuration.list:
    SUMMARY: Get OIDC configuration
    DESC: Provides OpenID Connect (OIDC) discovery information if OIDC authentication is configured for Weaviate. Returns details like the token issuer URL, client ID, and required scopes.
    HTTP:
      METHOD: GET
      ENDPOINT: /.well-known/openid-configuration
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - {}
      - oidc:
          type: oauth2
    EXECUTION:
      KIND: http
      MODE: sync
    RETURNS:
      - RETURNTYPE: STRUCT(get_well_known_openid_configuration_6d129c8c_get_well_known_openid_configuration_b25229a3Response200)
        RETURNVAR: weaviate_openid-configuration_list
        STATUS: 200
    ERRORS:
      - TYPE: ANY
        STATUS: 404
        WHEN: OIDC provider is not configured for this Weaviate instance. (HTTP 404)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 500
        WHEN: An internal server error occurred while retrieving OIDC configuration. Check the ErrorResponse for details. (HTTP 500)
    CANONICAL_ID: weaviate.openid-configuration.list
  weaviate.replicate.create:
    SUMMARY: Initiate a replica movement
    DESC: Begins an asynchronous operation to move or copy a specific shard replica from its current node to a designated target node. The operation involves copying data, synchronizing, and potentially decommissioning the source replica.
    HTTP:
      METHOD: POST
      ENDPOINT: /replication/replicate
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(ReplicationReplicateReplicaRequest)
    SECURITY:
      - {}
      - oidc:
          type: oauth2
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(ReplicationReplicateReplicaRequest)
          REQUIRED: true
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(ReplicationReplicateReplicaResponse)
        RETURNVAR: weaviate_replicate_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 400
        WHEN: Malformed request. (HTTP 400)
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized or invalid credentials. (HTTP 401)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 422
        WHEN: The request syntax is correct, but the server couldn't process it due to semantic issues. Please check the values in your request. (HTTP 422)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 500
        WHEN: An error has occurred while trying to fulfill the request. Most likely the ErrorResponse will contain more information about the error. (HTTP 500)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 501
        WHEN: Replica movement operations are disabled. (HTTP 501)
    CANONICAL_ID: weaviate.replicate.create
  weaviate.replicate.delete:
    SUMMARY: Delete all replication operations
    DESC: Schedules all replication operations for deletion across all collections, shards, and nodes.
    HTTP:
      METHOD: DELETE
      ENDPOINT: /replication/replicate
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - {}
      - oidc:
          type: oauth2
    EXECUTION:
      KIND: http
      MODE: sync
    ERRORS:
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 400
        WHEN: Malformed request. (HTTP 400)
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized or invalid credentials. (HTTP 401)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 422
        WHEN: The request syntax is correct, but the server couldn't process it due to semantic issues. Please check the values in your request. (HTTP 422)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 500
        WHEN: An error has occurred while trying to fulfill the request. Most likely the ErrorResponse will contain more information about the error. (HTTP 500)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 501
        WHEN: Replica movement operations are disabled. (HTTP 501)
    CANONICAL_ID: weaviate.replicate.delete
  weaviate.replicate.delete2:
    SUMMARY: Force delete replication operations
    DESC: USE AT OWN RISK! Synchronously force delete operations from the FSM. This will not perform any checks on which state the operation is in so may lead to data corruption or loss. It is recommended to first scale the number of replication engine workers to 0 before calling this endpoint to ensure no operations are in-flight.
    HTTP:
      METHOD: POST
      ENDPOINT: /replication/replicate/force-delete
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(ReplicationReplicateForceDeleteRequest)
    SECURITY:
      - {}
      - oidc:
          type: oauth2
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(ReplicationReplicateForceDeleteRequest)
          REQUIRED: false
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(ReplicationReplicateForceDeleteResponse)
        RETURNVAR: weaviate_replicate_delete2
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 400
        WHEN: Malformed request. (HTTP 400)
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized or invalid credentials. (HTTP 401)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 422
        WHEN: The request syntax is correct, but the server couldn't process it due to semantic issues. Please check the values in your request. (HTTP 422)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 500
        WHEN: An error has occurred while trying to fulfill the request. Most likely the ErrorResponse will contain more information about the error. (HTTP 500)
    CANONICAL_ID: weaviate.replicate.delete2
  weaviate.replicate.get:
    SUMMARY: Retrieve a replication operation
    DESC: Fetches the current status and detailed information for a specific replication operation, identified by its unique ID. Optionally includes historical data of the operation's progress if requested.
    HTTP:
      METHOD: GET
      ENDPOINT: /replication/replicate/{id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - {}
      - oidc:
          type: oauth2
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
          FORMAT: uuid
      - includeHistory:
          TYPE: BOOL
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(ReplicationReplicateDetailsReplicaResponse)
        RETURNVAR: weaviate_replicate_get
        STATUS: 200
    ERRORS:
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized or invalid credentials. (HTTP 401)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 403
        WHEN: Forbidden. (HTTP 403)
      - TYPE: ANY
        STATUS: 404
        WHEN: Shard replica operation not found. (HTTP 404)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 422
        WHEN: The request syntax is correct, but the server couldn't process it due to semantic issues. Please check the values in your request. (HTTP 422)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 500
        WHEN: An error has occurred while trying to fulfill the request. Most likely the ErrorResponse will contain more information about the error. (HTTP 500)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 501
        WHEN: Replica movement operations are disabled. (HTTP 501)
    CANONICAL_ID: weaviate.replicate.get
  weaviate.replicate.delete1:
    SUMMARY: Delete a replication operation
    DESC: Removes a specific replication operation. If the operation is currently active, it will be cancelled and its resources cleaned up before the operation is deleted.
    HTTP:
      METHOD: DELETE
      ENDPOINT: /replication/replicate/{id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - {}
      - oidc:
          type: oauth2
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
          FORMAT: uuid
    ERRORS:
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized or invalid credentials. (HTTP 401)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 403
        WHEN: Forbidden. (HTTP 403)
      - TYPE: ANY
        STATUS: 404
        WHEN: Shard replica operation not found. (HTTP 404)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 409
        WHEN: The operation is not in a deletable state, e.g. it is a MOVE op in the DEHYDRATING state. (HTTP 409)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 422
        WHEN: The request syntax is correct, but the server couldn't process it due to semantic issues. Please check the values in your request. (HTTP 422)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 500
        WHEN: An error has occurred while trying to fulfill the request. Most likely the ErrorResponse will contain more information about the error. (HTTP 500)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 501
        WHEN: Replica movement operations are disabled. (HTTP 501)
    CANONICAL_ID: weaviate.replicate.delete1
  weaviate.replicate.list:
    SUMMARY: List replication operations
    DESC: Retrieves a list of currently registered replication operations, optionally filtered by collection, shard, or node ID.
    HTTP:
      METHOD: GET
      ENDPOINT: /replication/replicate/list
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - {}
      - oidc:
          type: oauth2
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - targetNode:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - collection:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - shard:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - includeHistory:
          TYPE: BOOL
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: "[]STRUCT(ReplicationReplicateDetailsReplicaResponse)"
        RETURNVAR: weaviate_replicate_list
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 400
        WHEN: Bad request. (HTTP 400)
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized or invalid credentials. (HTTP 401)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 500
        WHEN: An error has occurred while trying to fulfill the request. Most likely the ErrorResponse will contain more information about the error. (HTTP 500)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 501
        WHEN: Replica movement operations are disabled. (HTTP 501)
    CANONICAL_ID: weaviate.replicate.list
  weaviate.replicate.cancel:
    SUMMARY: Cancel a replication operation
    DESC: Requests the cancellation of an active replication operation identified by its ID. The operation will be stopped, but its record will remain in the `CANCELLED` state (can't be resumed) and will not be automatically deleted.
    HTTP:
      METHOD: POST
      ENDPOINT: /replication/replicate/{id}/cancel
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - {}
      - oidc:
          type: oauth2
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
          FORMAT: uuid
    ERRORS:
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized or invalid credentials. (HTTP 401)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: ANY
        STATUS: 404
        WHEN: Shard replica operation not found. (HTTP 404)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 409
        WHEN: The operation is not in a cancellable state, e.g. it is READY or is a MOVE op in the DEHYDRATING state. (HTTP 409)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 422
        WHEN: The request syntax is correct, but the server couldn't process it due to semantic issues. Please check the values in your request. (HTTP 422)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 500
        WHEN: An error has occurred while trying to fulfill the request. Most likely the ErrorResponse will contain more information about the error. (HTTP 500)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 501
        WHEN: Replica movement operations are disabled. (HTTP 501)
    CANONICAL_ID: weaviate.replicate.cancel
  weaviate.sharding_state.list:
    SUMMARY: Get sharding state
    DESC: Fetches the current sharding state, including replica locations and statuses, for all collections or a specified collection. If a shard name is provided along with a collection, the state for that specific shard is returned.
    HTTP:
      METHOD: GET
      ENDPOINT: /replication/sharding-state
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - {}
      - oidc:
          type: oauth2
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - collection:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - shard:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(ReplicationShardingStateResponse)
        RETURNVAR: weaviate_sharding-state_list
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 400
        WHEN: Bad request. (HTTP 400)
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized or invalid credentials. (HTTP 401)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 404
        WHEN: Collection or shard not found. (HTTP 404)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 500
        WHEN: An error has occurred while trying to fulfill the request. Most likely the ErrorResponse will contain more information about the error. (HTTP 500)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 501
        WHEN: Replica movement operations are disabled. (HTTP 501)
    CANONICAL_ID: weaviate.sharding-state.list
  weaviate.scale.list:
    SUMMARY: Get replication scale plan
    DESC: Computes and returns a replication scale plan for a given collection and desired replication factor. The plan includes, for each shard, a list of nodes to be added and a list of nodes to be removed.
    HTTP:
      METHOD: GET
      ENDPOINT: /replication/scale
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - {}
      - oidc:
          type: oauth2
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - collection:
          TYPE: STRING
          REQUIRED: true
          LOCATION: query
      - replicationFactor:
          TYPE: INT
          REQUIRED: true
          LOCATION: query
          MINIMUM: 1
    RETURNS:
      - RETURNTYPE: STRUCT(ReplicationScalePlan)
        RETURNVAR: weaviate_scale_list
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 400
        WHEN: Bad request. (HTTP 400)
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized or invalid credentials. (HTTP 401)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 404
        WHEN: Collection not found. (HTTP 404)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 500
        WHEN: An error has occurred while trying to fulfill the request. Most likely the ErrorResponse will contain more information about the error. (HTTP 500)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 501
        WHEN: Replica movement operations are disabled. (HTTP 501)
    CANONICAL_ID: weaviate.scale.list
  weaviate.scale.create:
    SUMMARY: Apply replication scaling plan
    DESC: Apply a replication scaling plan that specifies nodes to add or remove per shard for a given collection.
    HTTP:
      METHOD: POST
      ENDPOINT: /replication/scale
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(ReplicationScalePlan)
    SECURITY:
      - {}
      - oidc:
          type: oauth2
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(ReplicationScalePlan)
          REQUIRED: true
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(ReplicationScaleApplyResponse)
        RETURNVAR: weaviate_scale_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 400
        WHEN: Bad request. (HTTP 400)
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized or invalid credentials. (HTTP 401)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 404
        WHEN: Collection not found. (HTTP 404)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 500
        WHEN: An error has occurred while trying to fulfill the request. Most likely the ErrorResponse will contain more information about the error. (HTTP 500)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 501
        WHEN: Replica movement operations are disabled. (HTTP 501)
    CANONICAL_ID: weaviate.scale.create
  weaviate.own_info.list:
