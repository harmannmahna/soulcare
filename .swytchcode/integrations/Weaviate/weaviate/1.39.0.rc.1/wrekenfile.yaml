  weaviate.namespace.delete:
    SUMMARY: Delete a namespace
    DESC: "Mark a namespace for deletion. The endpoint is asynchronous: the namespace is flipped to the \"deleting\" state, which stops its dynamic users from authenticating; their rows, along with classes and aliases, are reclaimed by the leader on a periodic cleanup tick. Repeated calls while the namespace is still in the \"deleting\" state are idempotent and return 202."
    HTTP:
      METHOD: DELETE
      ENDPOINT: /namespaces/{namespace_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - {}
      - oidc:
          type: oauth2
    EXECUTION:
      KIND: http
      MODE: async
    INPUTS:
      - namespace_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
    ERRORS:
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized or invalid credentials. (HTTP 401)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 404
        WHEN: Not Found - Namespace does not exist, or the namespaces feature is not enabled on this cluster. (HTTP 404)
      - TYPE: STRUCT(ErrorResponse)
