    - name: objects
      TYPE: "[]STRUCT(BatchDeleteResponse_results_objects_Item)"
      REQUIRED: false
      comment: With output set to `minimal` only objects with error occurred will the be described. Successfully deleted objects would be omitted. Output set to `verbose` will list all of the objects with their respective statuses.
  BatchDeleteResponse:
    - name: match
      TYPE: STRUCT(BatchDeleteResponse_match)
      REQUIRED: false
      comment: Outlines how to find the objects to be deleted.
    - name: output
      TYPE: STRING
      REQUIRED: false
      DEFAULT: minimal
      comment: "Controls the verbosity of the output, possible values are: `minimal`, `verbose`. Defaults to `minimal`."
    - name: deletionTimeUnixMilli
      TYPE: INT
      REQUIRED: false
      FORMAT: int64
      NULLABLE: true
      comment: Timestamp of deletion in milliseconds since epoch UTC.
    - name: dryRun
      TYPE: BOOL
      REQUIRED: false
      DEFAULT: false
      comment: If true, objects will not be deleted yet, but merely listed. Defaults to false.
    - name: results
      TYPE: STRUCT(BatchDeleteResponse_results)
