  weaviate.suspend.create:
    SUMMARY: Suspend a namespace
    DESC: Move a namespace to the "suspended" state. Suspending stops the namespace's users from authenticating and blocks the creation of new classes, aliases, users, roles, and role assignments, but retains the namespace and everything it owns. Repeated calls against an already-suspended namespace are idempotent and return 202. Use the resume endpoint to return it to "active".
    HTTP:
      METHOD: POST
      ENDPOINT: /namespaces/{namespace_id}/suspend
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - {}
      - oidc:
          type: oauth2
    EXECUTION:
      KIND: http
      MODE: async
    INPUTS:
      - namespace_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
    ERRORS:
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized or invalid credentials. (HTTP 401)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 404
        WHEN: Not Found - Namespace does not exist, or the namespaces feature is not enabled on this cluster. (HTTP 404)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 409
        WHEN: Another state change was applied to this namespace while this request was in flight, so it was not applied. Re-read the namespace and retry if the change is still wanted. (HTTP 409)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 422
        WHEN: The request syntax is correct, but the server couldn't process it due to semantic issues (e.g. invalid name format, reserved name, or a namespace that is being deleted). (HTTP 422)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 500
        WHEN: An error has occurred while trying to fulfill the request. Most likely the ErrorResponse will contain more information about the error. (HTTP 500)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 503
        WHEN: No cluster leader was reachable. The state change may or may not have been applied; re-read the namespace before retrying. (HTTP 503)
    CANONICAL_ID: weaviate.suspend.create
  weaviate.resume.create:
