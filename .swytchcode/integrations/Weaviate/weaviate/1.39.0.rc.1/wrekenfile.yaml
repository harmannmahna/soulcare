          LOCATION: path
      - body:
          TYPE: STRUCT(Property)
          REQUIRED: true
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(Property)
        RETURNVAR: weaviate_property_create
        STATUS: 200
    ERRORS:
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized or invalid credentials. (HTTP 401)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(RestrictionViolationResponse)
        STATUS: 422
        WHEN: Invalid property definition provided. (HTTP 422)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 500
        WHEN: An error occurred while adding the property. Check the ErrorResponse for details. (HTTP 500)
    CANONICAL_ID: weaviate.property.create
  weaviate.index.get:
    SUMMARY: Get index status for all properties of a collection
    DESC: Returns per-property index state including active reindex progress. This powers the UI to show live migration status.
    HTTP:
      METHOD: GET
      ENDPOINT: /schema/{className}/indexes
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - {}
      - oidc:
          type: oauth2
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - className:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(IndexStatusResponse)
        RETURNVAR: weaviate_index_get
        STATUS: 200
    ERRORS:
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized or invalid credentials. (HTTP 401)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: ANY
        STATUS: 404
        WHEN: Collection not found. (HTTP 404)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 500
        WHEN: An error occurred. (HTTP 500)
    CANONICAL_ID: weaviate.index.get
  weaviate.property.index.update:
    SUMMARY: Declaratively create or migrate a property's inverted index
    DESC: "Upserts the inverted index of a property, identified by `indexName`. The body describes the desired index configuration; the server diffs it against the current state and either creates the index, migrates its configuration, or does nothing. Index-mutating work is asynchronous: a `202` with a task ID is returned when a reindex task is submitted, and `200` with `{\"status\":\"NO_OP\"}` is returned when the desired configuration is already in place. `indexName` accepts `rangeable` as an alias for `rangeFilters`."
    HTTP:
      METHOD: PUT
      ENDPOINT: /schema/{className}/properties/{propertyName}/index/{indexName}
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(IndexUpsertRequest)
    SECURITY:
      - {}
      - oidc:
          type: oauth2
    EXECUTION:
      KIND: http
      MODE: async
    INPUTS:
      - className:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - propertyName:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - indexName:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
          ENUM:
            - filterable
            - searchable
            - rangeFilters
            - rangeable
      - tenants:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
          STYLE: form
          EXPLODE: false
      - body:
          TYPE: STRUCT(IndexUpsertRequest)
          REQUIRED: true
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(IndexUpdateResponse)
        RETURNVAR: weaviate_property_index_update
        STATUS: 200
      - RETURNTYPE: STRUCT(IndexUpdateResponse)
        RETURNVAR: weaviate_property_index_update_202
        STATUS: 202
    ERRORS:
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 400
        WHEN: Validation failure; the message carries an actionable hint. (HTTP 400)
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized or invalid credentials. (HTTP 401)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 404
        WHEN: Unknown collection or property. (HTTP 404)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 409
        WHEN: Conflicting in-flight reindex task; the message names the offending task ID. (HTTP 409)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 422
        WHEN: Invalid `indexName` path value. (HTTP 422)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 429
        WHEN: Per-collection cap of concurrent active reindex tasks reached. (HTTP 429)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 500
        WHEN: An error occurred. (HTTP 500)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 503
        WHEN: Cluster service unavailable, or an in-flight task's payload cannot be parsed so conflict-freedom cannot be proven. (HTTP 503)
    CANONICAL_ID: weaviate.property.index.update
  weaviate.property.index.delete:
    SUMMARY: Delete a property's inverted index
    DESC: Deletes an inverted index of a specific property within a collection (`className`). The index to delete is identified by `indexName` and must be one of `filterable`, `searchable`, or `rangeFilters` (with `rangeable` accepted as an alias for `rangeFilters`).
    HTTP:
      METHOD: DELETE
      ENDPOINT: /schema/{className}/properties/{propertyName}/index/{indexName}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - {}
      - oidc:
          type: oauth2
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - className:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - propertyName:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - indexName:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
          ENUM:
            - filterable
            - searchable
            - rangeFilters
            - rangeable
    ERRORS:
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized or invalid credentials. (HTTP 401)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 422
        WHEN: Invalid index, property or collection provided. (HTTP 422)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 500
        WHEN: An error occurred while deleting the index. Check the ErrorResponse for details. (HTTP 500)
    CANONICAL_ID: weaviate.property.index.delete
  weaviate.property.rebuild.create:
    SUMMARY: Rebuild a property's inverted index with unchanged configuration
    DESC: "Rebuilds the inverted index from the stored objects with its current configuration (repair / format refresh). No request body. Index-mutating work is asynchronous: a `202` with a task ID is returned. `indexName` accepts `rangeable` as an alias for `rangeFilters`."
    HTTP:
