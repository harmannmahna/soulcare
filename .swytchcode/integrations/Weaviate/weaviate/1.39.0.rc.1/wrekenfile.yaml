  ReferenceMetaClassification:
    - name: overallCount
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: int64
      comment: overall neighbors checked as part of the classification. In most cases this will equal k, but could be lower than k - for example if not enough data was present
    - name: winningCount
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: int64
      comment: size of the winning group, a number between 1..k
    - name: losingCount
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: int64
      comment: size of the losing group, can be 0 if the winning group size equals k
    - name: closestOverallDistance
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float32
      comment: The lowest distance of any neighbor, regardless of whether they were in the winning or losing group
    - name: winningDistance
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float32
      comment: deprecated - do not use, to be removed in 0.23.0
    - name: meanWinningDistance
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float32
      comment: Mean distance of all neighbors from the winning group
    - name: closestWinningDistance
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float32
      comment: Closest distance of a neighbor from the winning group
    - name: closestLosingDistance
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float32
      NULLABLE: true
      comment: The lowest distance of a neighbor in the losing group. Optional. If k equals the size of the winning group, there is no losing group
    - name: losingDistance
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float32
      NULLABLE: true
      comment: deprecated - do not use, to be removed in 0.23.0
    - name: meanLosingDistance
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float32
      NULLABLE: true
      comment: Mean distance of all neighbors from the losing group. Optional. If k equals the size of the winning group, there is no losing group.
