  GraphQLError_locations_Item:
    - name: column
      TYPE: INT
      REQUIRED: false
      FORMAT: int64
    - name: line
      TYPE: INT
      REQUIRED: false
      FORMAT: int64
  GraphQLError:
    - name: locations
      TYPE: "[]STRUCT(GraphQLError_locations_Item)"
      REQUIRED: false
    - name: message
      TYPE: STRING
      REQUIRED: false
    - name: path
      TYPE: "[]STRING"
      REQUIRED: false
  GraphQLQuery_variables:
    - name: value
      TYPE: ANY
      REQUIRED: false
  GraphQLQuery:
    - name: operationName
      TYPE: STRING
      REQUIRED: false
      comment: The name of the operation if multiple exist in the query.
    - name: query
      TYPE: STRING
      REQUIRED: false
      comment: Query based on GraphQL syntax.
    - name: variables
      TYPE: STRUCT(GraphQLQuery_variables)
      REQUIRED: false
      comment: Additional variables for the query.
  GraphQLResponse:
    - name: data
      TYPE: map[STRING]ANY
      REQUIRED: false
      comment: GraphQL data object.
    - name: errors
      TYPE: "[]STRUCT(GraphQLError)"
      REQUIRED: false
      comment: Array with errors.
  InvertedIndexConfig:
    - name: cleanupIntervalSeconds
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: int
      comment: "Asynchronous index clean up happens every n seconds (default: 60)."
    - name: bm25
      TYPE: STRUCT(BM25Config)
      REQUIRED: false
    - name: stopwords
      TYPE: STRUCT(StopwordConfig)
      REQUIRED: false
    - name: indexTimestamps
      TYPE: BOOL
      REQUIRED: false
      comment: "Index each object by its internal timestamps (default: `false`)."
    - name: indexNullState
      TYPE: BOOL
      REQUIRED: false
      comment: "Index each object with the null state (default: `false`)."
    - name: indexPropertyLength
      TYPE: BOOL
      REQUIRED: false
      comment: "Index length of properties (default: `false`)."
    - name: usingBlockMaxWAND
      TYPE: BOOL
      REQUIRED: false
      comment: "Using BlockMax WAND for query execution (default: `false`, will be `true` for new collections created after 1.30)."
    - name: tokenizerUserDict
      TYPE: "[]STRUCT(TokenizerUserDictConfig)"
      REQUIRED: false
      comment: User-defined dictionary for tokenization.
    - name: stopwordPresets
      TYPE: map[STRING]ANY
      REQUIRED: false
      comment: User-defined named stopword lists. Each key is a preset name that can be referenced by a property's textAnalyzer.stopwordPreset field. The value is an array of stopword strings. Preset names must not be empty or whitespace-only; each list must contain at least one word; individual words must not be empty or whitespace-only.
  ReplicationConfig:
    - name: factor
      TYPE: INT
      REQUIRED: false
      comment: "Number of times a collection (class) is replicated (default: 1)."
    - name: asyncConfig
      TYPE: STRUCT(ReplicationAsyncConfig)
      REQUIRED: false
    - name: deletionStrategy
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - NoAutomatedResolution
        - DeleteOnConflict
        - TimeBasedResolution
      comment: Conflict resolution strategy for deleted objects.
  BM25Config:
    - name: k1
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float
      comment: "Calibrates term-weight scaling based on the term frequency within a document (default: 1.2)."
    - name: b
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float
      comment: "Calibrates term-weight scaling based on the document length (default: 0.75)."
  StopwordConfig:
    - name: preset
      TYPE: STRING
      REQUIRED: false
      comment: "Pre-existing list of common words by language (default: `en`). Options: [`en`, `none`]."
    - name: additions
      TYPE: "[]STRING"
      REQUIRED: false
      comment: "Stopwords to be considered additionally (default: []). Can be any array of custom strings."
    - name: removals
      TYPE: "[]STRING"
      REQUIRED: false
      comment: "Stopwords to be removed from consideration (default: []). Can be any array of custom strings."
  TokenizerUserDictConfig_replacements_Item:
    - name: source
      TYPE: STRING
      REQUIRED: true
      comment: The string to be replaced.
    - name: target
      TYPE: STRING
      REQUIRED: true
      comment: The string to replace with.
  TokenizerUserDictConfig:
    - name: tokenizer
      TYPE: STRING
      REQUIRED: false
      comment: The tokenizer to which the user dictionary should be applied. Currently, only the `kagame` ja and kr tokenizers supports user dictionaries.
    - name: replacements
      TYPE: "[]STRUCT(TokenizerUserDictConfig_replacements_Item)"
      REQUIRED: false
  TokenizeRequest:
    - name: text
      TYPE: STRING
      REQUIRED: true
      comment: The text to tokenize.
    - name: tokenization
      TYPE: STRING
      REQUIRED: true
      ENUM:
        - word
        - lowercase
        - whitespace
        - field
        - trigram
        - gse
        - kagome_kr
        - kagome_ja
        - gse_ch
      comment: The tokenization method to apply.
    - name: analyzerConfig
      TYPE: STRUCT(TextAnalyzerConfig)
      REQUIRED: false
    - name: stopwords
      TYPE: STRUCT(StopwordConfig)
      REQUIRED: false
    - name: stopwordPresets
      TYPE: map[STRING]ANY
      REQUIRED: false
      comment: "Optional user-defined named stopword presets. Shape matches InvertedIndexConfig.stopwordPresets on a collection: each key is a preset name, each value is a plain list of stopwords. A preset name that matches a built-in ('en', 'none') fully replaces the built-in. Preset names must not be empty or whitespace-only; each word list must contain at least one word; individual words must not be empty or whitespace-only. Mutually exclusive with stopwords — pass one or the other, not both."
  TokenizeResponse:
    - name: indexed
      TYPE: "[]STRING"
      REQUIRED: false
      comment: The tokens as they would be stored in the inverted index.
    - name: query
      TYPE: "[]STRING"
      REQUIRED: false
      comment: The tokens as they would be used for query matching (e.g., after stopword removal).
  PropertyTokenizeRequest:
    - name: text
      TYPE: STRING
      REQUIRED: true
      comment: The text to tokenize using the property's configured tokenization.
  MultiTenancyConfig:
    - name: enabled
      TYPE: BOOL
      REQUIRED: false
      comment: "Whether or not multi-tenancy is enabled for this collection (class) (default: `false`)."
    - name: autoTenantCreation
      TYPE: BOOL
      REQUIRED: false
      comment: "Nonexistent tenants should (not) be created implicitly (default: `false`)."
    - name: autoTenantActivation
      TYPE: BOOL
      REQUIRED: false
      comment: "Existing tenants should (not) be turned HOT implicitly when they are accessed and in another activity status (default: `false`)."
  ObjectTtlConfig:
    - name: enabled
      TYPE: BOOL
      REQUIRED: false
      comment: "Whether or not object ttl is enabled for this collection (default: `false`)."
    - name: defaultTtl
      TYPE: INT
      REQUIRED: false
      comment: "Interval (in seconds) to be added to `deleteOn` value, denoting object's expiration time. Has to be positive for `deleteOn` set to `_creationTimeUnix` or `_lastUpdateTimeUnix`, any for custom property (default: `0`)."
    - name: deleteOn
      TYPE: STRING
      REQUIRED: false
      comment: Name of the property holding base time to compute object's expiration time (ttl = value of deleteOn property + defaultTtl). Can be set to `_creationTimeUnix`, `_lastUpdateTimeUnix` or custom property of `date` datatype.
    - name: filterExpiredObjects
      TYPE: BOOL
      REQUIRED: false
      comment: "Whether remove from resultset expired, but not yet deleted by background process objects (default: `false`)."
  Meta_modules:
    - name: value
      TYPE: ANY
      REQUIRED: false
  Meta:
    - name: hostname
      TYPE: STRING
      REQUIRED: false
      FORMAT: url
      comment: The url of the host.
    - name: version
      TYPE: STRING
      REQUIRED: false
      comment: The Weaviate server version.
    - name: modules
      TYPE: STRUCT(Meta_modules)
      REQUIRED: false
      comment: Module-specific meta information.
    - name: grpcMaxMessageSize
      TYPE: INT
      REQUIRED: false
      comment: Max message size for GRPC connection in bytes.
  ReplicationReplicateReplicaRequest:
    - name: sourceNode
      TYPE: STRING
      REQUIRED: true
      comment: The name of the Weaviate node currently hosting the shard replica that needs to be moved or copied.
    - name: targetNode
      TYPE: STRING
      REQUIRED: true
      comment: The name of the Weaviate node where the new shard replica will be created as part of the movement or copy operation.
    - name: collection
      TYPE: STRING
      REQUIRED: true
      comment: The name of the collection to which the target shard belongs.
    - name: shard
      TYPE: STRING
      REQUIRED: true
      comment: The name of the shard whose replica is to be moved or copied.
    - name: type
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - COPY
        - MOVE
      DEFAULT: COPY
      comment: Specifies the type of replication operation to perform. `COPY` creates a new replica on the target node while keeping the source replica. `MOVE` creates a new replica on the target node and then removes the source replica upon successful completion. Defaults to `COPY` if omitted.
  ReplicationReplicateReplicaResponse:
    - name: id
      TYPE: STRING
      REQUIRED: true
      FORMAT: uuid
      comment: The unique identifier (ID) assigned to the registered replication operation.
  ReplicationShardingStateResponse:
    - name: shardingState
      TYPE: STRUCT(ReplicationShardingState)
      REQUIRED: false
  ReplicationScalePlan_shardScaleActions_Value:
    - name: removeNodes
      TYPE: "[]STRING"
      REQUIRED: false
      comment: List of node identifiers from which replicas of this shard should be removed. Nodes listed here must not appear in 'addNodes' for the same shard, and cannot be used as a source node for any addition in this shard except in the implicit move case, where they appear as both a source and a node to remove.
    - name: addNodes
      TYPE: map[STRING]STRING
      REQUIRED: false
      comment: A mapping of target node identifiers to their addition configuration. Each key represents a target node where a new replica will be added. The value may be null, which means an empty replica will be created, or a string specifying the source node from which shard data will be copied. If the source node is also marked for removal in the same shard, this addition is treated as a move operation, and that source node can only appear once as a source node for that shard. If the source node is not being removed, it can be used as the source for multiple additions (copy operations).
  ReplicationScalePlan:
    - name: planId
      TYPE: STRING
      REQUIRED: true
      FORMAT: uuid
      comment: A unique identifier for this replication scaling plan, useful for tracking and auditing purposes.
    - name: collection
      TYPE: STRING
      REQUIRED: true
      comment: The name of the collection to which this replication scaling plan applies.
    - name: shardScaleActions
      TYPE: map[STRING]STRUCT(ReplicationScalePlan_shardScaleActions_Value)
      REQUIRED: true
      comment: A mapping of shard names to their corresponding scaling actions. Each key corresponds to a shard name, and its value defines which nodes should be removed and which should be added for that shard. If a source node listed for an addition is also in 'removeNodes' for the same shard, that addition is treated as a move operation. Such a node can appear only once as a source in that shard. Otherwise, if the source node is not being removed, it represents a copy operation and can be referenced multiple times as a source for additions.
  ReplicationScaleApplyResponse:
    - name: operationIds
      TYPE: "[]STRING"
      REQUIRED: true
      comment: List of shard copy operation IDs created during scaling.
    - name: planId
      TYPE: STRING
      REQUIRED: true
      FORMAT: uuid
      comment: The unique identifier of the replication scaling plan that generated these operations.
    - name: collection
      TYPE: STRING
      REQUIRED: true
      comment: The name of the collection associated with this replication scaling plan.
  ReplicationShardReplicas:
    - name: shard
      TYPE: STRING
      REQUIRED: false
    - name: replicas
      TYPE: "[]STRING"
      REQUIRED: false
  ReplicationShardingState:
    - name: collection
      TYPE: STRING
      REQUIRED: false
      comment: The name of the collection.
    - name: shards
      TYPE: "[]STRUCT(ReplicationShardReplicas)"
      REQUIRED: false
      comment: An array detailing each shard within the collection and the nodes hosting its replicas.
  ReplicationReplicateDetailsReplicaStatusError:
    - name: whenErroredUnixMs
      TYPE: INT
      REQUIRED: false
      FORMAT: int64
      comment: The unix timestamp in ms when the error occurred. This is an approximate time and so should not be used for precise timing.
    - name: message
      TYPE: STRING
      REQUIRED: false
      comment: A human-readable message describing the error.
  ReplicationReplicateDetailsReplicaStatus:
    - name: state
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - REGISTERED
        - HYDRATING
        - FINALIZING
        - INTEGRATING
        - DEHYDRATING
        - READY
        - CANCELLED
      comment: The current operational state of the replica during the replication process.
    - name: whenStartedUnixMs
      TYPE: INT
      REQUIRED: false
      FORMAT: int64
      comment: The UNIX timestamp in ms when this state was first entered. This is an approximate time and so should not be used for precise timing.
    - name: errors
      TYPE: "[]STRUCT(ReplicationReplicateDetailsReplicaStatusError)"
      REQUIRED: false
      comment: A list of error messages encountered by this replica during the replication operation, if any.
  ReplicationReplicateDetailsReplicaResponse:
    - name: id
      TYPE: STRING
      REQUIRED: true
      FORMAT: uuid
      comment: The unique identifier (ID) of this specific replication operation.
    - name: shard
      TYPE: STRING
      REQUIRED: true
      comment: The name of the shard involved in this replication operation.
    - name: collection
      TYPE: STRING
      REQUIRED: true
      comment: The name of the collection to which the shard being replicated belongs.
    - name: sourceNode
      TYPE: STRING
      REQUIRED: true
      comment: The identifier of the node from which the replica is being moved or copied (the source node).
    - name: targetNode
      TYPE: STRING
      REQUIRED: true
      comment: The identifier of the node to which the replica is being moved or copied (the target node).
    - name: type
      TYPE: STRING
      REQUIRED: true
      ENUM:
        - COPY
        - MOVE
      comment: Indicates whether the operation is a `COPY` (source replica remains) or a `MOVE` (source replica is removed after successful transfer).
    - name: uncancelable
      TYPE: BOOL
      REQUIRED: false
      comment: Whether the replica operation can't be cancelled.
    - name: scheduledForCancel
      TYPE: BOOL
      REQUIRED: false
      comment: Whether the replica operation is scheduled for cancellation.
    - name: scheduledForDelete
      TYPE: BOOL
      REQUIRED: false
      comment: Whether the replica operation is scheduled for deletion.
    - name: status
      TYPE: STRUCT(ReplicationReplicateDetailsReplicaStatus)
      REQUIRED: true
    - name: statusHistory
      TYPE: "[]STRUCT(ReplicationReplicateDetailsReplicaStatus)"
      REQUIRED: false
      comment: An array detailing the historical sequence of statuses the replication operation has transitioned through, if requested and available.
    - name: whenStartedUnixMs
      TYPE: INT
      REQUIRED: false
      FORMAT: int64
      comment: The UNIX timestamp in ms when the replication operation was initiated. This is an approximate time and so should not be used for precise timing.
  ReplicationReplicateForceDeleteRequest:
    - name: id
      TYPE: STRING
      REQUIRED: false
      FORMAT: uuid
      comment: The unique identifier (ID) of the replication operation to be forcefully deleted.
    - name: collection
      TYPE: STRING
      REQUIRED: false
      comment: The name of the collection to which the shard being replicated belongs.
    - name: shard
      TYPE: STRING
      REQUIRED: false
      comment: The identifier of the shard involved in the replication operations.
    - name: node
      TYPE: STRING
      REQUIRED: false
      comment: The name of the target node where the replication operations are registered.
    - name: dryRun
      TYPE: BOOL
      REQUIRED: false
      DEFAULT: false
      comment: If true, the operation will not actually delete anything but will return the expected outcome of the deletion.
  ReplicationReplicateForceDeleteResponse:
    - name: deleted
      TYPE: "[]STRING"
      REQUIRED: false
      comment: The unique identifiers (IDs) of the replication operations that were forcefully deleted.
    - name: dryRun
      TYPE: BOOL
      REQUIRED: false
      comment: Indicates whether the operation was a dry run (true) or an actual deletion (false).
  VectorWeights:
    - name: value
      TYPE: ANY
      REQUIRED: false
  PropertySchema:
    - name: value
      TYPE: ANY
      REQUIRED: false
  Schema:
    - name: classes
      TYPE: "[]STRUCT(Class)"
      REQUIRED: false
      comment: Semantic classes that are available.
    - name: maintainer
      TYPE: STRING
      REQUIRED: false
      FORMAT: email
      comment: Email of the maintainer.
    - name: name
      TYPE: STRING
      REQUIRED: false
      comment: Name of the schema.
  Class_vectorIndexConfig:
    - name: value
      TYPE: ANY
      REQUIRED: false
  Class_shardingConfig:
    - name: value
      TYPE: ANY
      REQUIRED: false
  Class_moduleConfig:
    - name: value
      TYPE: ANY
      REQUIRED: false
  Class:
    - name: class
      TYPE: STRING
      REQUIRED: false
      comment: Name of the collection (formerly 'class') (required). Multiple words should be concatenated in CamelCase, e.g. `ArticleAuthor`.
    - name: vectorConfig
      TYPE: map[STRING]ANY
      REQUIRED: false
      comment: Configure named vectors. Either use this field or `vectorizer`, `vectorIndexType`, and `vectorIndexConfig` fields. Available from `v1.24.0`.
    - name: vectorIndexType
      TYPE: STRING
      REQUIRED: false
      comment: Name of the vector index type to use for the collection (e.g. `hnsw` or `flat`).
    - name: vectorIndexConfig
      TYPE: STRUCT(Class_vectorIndexConfig)
      REQUIRED: false
      comment: Vector-index config, that is specific to the type of index selected in vectorIndexType
    - name: shardingConfig
      TYPE: STRUCT(Class_shardingConfig)
      REQUIRED: false
      comment: Manage how the index should be sharded and distributed in the cluster
    - name: replicationConfig
      TYPE: STRUCT(ReplicationConfig)
      REQUIRED: false
    - name: invertedIndexConfig
      TYPE: STRUCT(InvertedIndexConfig)
      REQUIRED: false
    - name: multiTenancyConfig
      TYPE: STRUCT(MultiTenancyConfig)
      REQUIRED: false
    - name: objectTtlConfig
      TYPE: STRUCT(ObjectTtlConfig)
      REQUIRED: false
    - name: vectorizer
      TYPE: STRING
      REQUIRED: false
      comment: Specify how the vectors for this collection should be determined. The options are either `none` - this means you have to import a vector with each object yourself - or the name of a module that provides vectorization capabilities, such as `text2vec-weaviate`. If left empty, it will use the globally configured default ([`DEFAULT_VECTORIZER_MODULE`](https://docs.weaviate.io/deploy/configuration/env-vars)) which can itself either be `none` or a specific module.
    - name: moduleConfig
      TYPE: STRUCT(Class_moduleConfig)
      REQUIRED: false
      comment: Configuration specific to modules in a collection context.
    - name: description
      TYPE: STRING
      REQUIRED: false
      comment: Description of the collection for metadata purposes.
    - name: properties
      TYPE: "[]STRUCT(Property)"
      REQUIRED: false
      comment: Define properties of the collection.
  Property_moduleConfig:
    - name: value
      TYPE: ANY
      REQUIRED: false
  Property:
    - name: dataType
      TYPE: "[]STRING"
      REQUIRED: false
      comment: Data type of the property (required). If it starts with a capital (for example Person), may be a reference to another type.
    - name: description
      TYPE: STRING
      REQUIRED: false
      comment: Description of the property.
    - name: moduleConfig
      TYPE: STRUCT(Property_moduleConfig)
      REQUIRED: false
      comment: Configuration specific to modules in a collection context.
    - name: name
      TYPE: STRING
      REQUIRED: false
      comment: The name of the property (required). Multiple words should be concatenated in camelCase, e.g. `nameOfAuthor`.
    - name: indexInverted
      TYPE: BOOL
      REQUIRED: false
      NULLABLE: true
      comment: (Deprecated). Whether to include this property in the inverted index. If `false`, this property cannot be used in `where` filters, `bm25` or `hybrid` search. <br/><br/>Unrelated to vectorization behavior (deprecated as of v1.19; use indexFilterable or/and indexSearchable instead)
    - name: bucketGeneration
      TYPE: INT
      REQUIRED: false
      FORMAT: int64
      comment: Internal RAFT-replicated counter bumped by semantic runtime-reindex migrations (e.g. change-tokenization, enable-filterable, enable-searchable). Used by the data path to resolve the property's inverted-index bucket name; a single RAFT commit flipping the schema flag AND bumping this counter atomically cuts the cluster from the old bucket to the new one. Defaults to 0. Internal use; clients should not set this.
    - name: searchableBlockmax
      TYPE: BOOL
      REQUIRED: false
      NULLABLE: true
      comment: "Internal RAFT-replicated per-property flag: true iff this property's searchable (BM25) bucket is on the blockmax (StrategyInverted) index. Stamped at migration cutover. Absent/null means \"not stamped\" and is resolved against the class-wide UsingBlockMaxWAND flag. Internal use; clients must not set this."
    - name: indexFilterable
      TYPE: BOOL
      REQUIRED: false
      NULLABLE: true
      comment: "Whether to include this property in the filterable, Roaring Bitmap index. If `false`, this property cannot be used in `where` filters. <br/><br/>Note: Unrelated to vectorization behavior."
    - name: indexSearchable
      TYPE: BOOL
      REQUIRED: false
      NULLABLE: true
      comment: Optional. Should this property be indexed in the inverted index. Defaults to true. Applicable only to properties of data type text and text[]. If you choose false, you will not be able to use this property in bm25 or hybrid search. This property has no affect on vectorization decisions done by modules
    - name: indexRangeFilters
      TYPE: BOOL
      REQUIRED: false
      NULLABLE: true
      comment: Whether to include this property in the filterable, range-based Roaring Bitmap index. Provides better performance for range queries compared to filterable index in large datasets. Applicable only to properties of data type int, number, date.
    - name: tokenization
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - word
        - lowercase
        - whitespace
        - field
        - trigram
        - gse
        - kagome_kr
        - kagome_ja
        - gse_ch
      comment: "Determines how a property is indexed. This setting applies to `text` and `text[]` data types. The following tokenization methods are available:<br/><br/>- `word` (default): Splits the text on any non-alphanumeric characters and lowercases the tokens.<br/>- `lowercase`: Splits the text on whitespace and lowercases the tokens.<br/>- `whitespace`: Splits the text on whitespace. This tokenization is case-sensitive.<br/>- `field`: Indexes the entire property value as a single token after trimming whitespace.<br/>- `trigram`: Splits the property into rolling trigrams (three-character sequences).<br/>- `gse`: Uses the `gse` tokenizer, suitable for Chinese language text. [See `gse` docs](https://pkg.go.dev/github.com/go-ego/gse#section-readme).<br/>- `kagome_ja`: Uses the `Kagome` tokenizer with a Japanese (IPA) dictionary. [See `kagome` docs](https://github.com/ikawaha/kagome).<br/>- `kagome_kr`: Uses the `Kagome` tokenizer with a Korean dictionary. [See `kagome` docs](https://github.com/ikawaha/kagome).<br/><br/>See [Reference: Tokenization](https://docs.weaviate.io/weaviate/config-refs/collections#tokenization) for details."
    - name: nestedProperties
      TYPE: "[]STRUCT(NestedProperty)"
      REQUIRED: false
      comment: The properties of the nested object(s). Applies to object and object[] data types.
    - name: disableDuplicatedReferences
      TYPE: BOOL
      REQUIRED: false
      NULLABLE: true
      DEFAULT: true
      comment: If set to false, allows multiple references to the same target object within this property. Setting it to true will enforce uniqueness of references within this property. By default, this is set to true.
    - name: textAnalyzer
      TYPE: STRUCT(TextAnalyzerConfig)
      REQUIRED: false
  TextAnalyzerConfig:
    - name: asciiFold
      TYPE: BOOL
      REQUIRED: false
      comment: If true, accent/diacritic marks are folded to their base characters during indexing and search. For example, 'école' matches 'ecole'. Defaults to false.
    - name: asciiFoldIgnore
      TYPE: "[]STRING"
      REQUIRED: false
      comment: If provided, specifies a list of characters that should be excluded from ascii folding. For example, if ['é'] is provided, then 'é' will not be folded to 'e' during indexing and search. This list is immutable after the property is created.
    - name: stopwordPreset
      TYPE: STRING
      REQUIRED: false
      comment: Stopword preset name. Overrides the collection-level invertedIndexConfig.stopwords for this property. Only applies to properties using 'word' tokenization. Can be a built-in preset ('en', 'none') or a user-defined preset from invertedIndexConfig.stopwordPresets.
  NestedProperty:
    - name: dataType
      TYPE: "[]STRING"
      REQUIRED: false
    - name: description
      TYPE: STRING
      REQUIRED: false
    - name: name
      TYPE: STRING
      REQUIRED: false
    - name: indexFilterable
      TYPE: BOOL
      REQUIRED: false
      NULLABLE: true
    - name: indexSearchable
      TYPE: BOOL
      REQUIRED: false
      NULLABLE: true
    - name: indexRangeFilters
      TYPE: BOOL
      REQUIRED: false
      NULLABLE: true
    - name: tokenization
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - word
        - lowercase
        - whitespace
        - field
        - trigram
        - gse
        - kagome_kr
        - kagome_ja
        - gse_ch
    - name: nestedProperties
      TYPE: "[]STRUCT(NestedProperty)"
      REQUIRED: false
      comment: The properties of the nested object(s). Applies to object and object[] data types.
    - name: textAnalyzer
      TYPE: STRUCT(TextAnalyzerConfig)
