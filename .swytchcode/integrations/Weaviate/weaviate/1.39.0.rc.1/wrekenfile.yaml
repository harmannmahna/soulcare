      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - {}
      - oidc:
          type: oauth2
    EXECUTION:
      KIND: http
      MODE: async
    INPUTS:
      - className:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - propertyName:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - indexName:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
          ENUM:
            - filterable
            - searchable
            - rangeFilters
            - rangeable
      - tenants:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
          STYLE: form
          EXPLODE: false
    RETURNS:
      - RETURNTYPE: STRUCT(IndexUpdateResponse)
        RETURNVAR: weaviate_property_rebuild_create_202
        STATUS: 202
    ERRORS:
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 400
        WHEN: Validation failure; the message carries an actionable hint. (HTTP 400)
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized or invalid credentials. (HTTP 401)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 404
        WHEN: Unknown collection or property. (HTTP 404)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 409
        WHEN: Conflicting in-flight reindex task; the message names the offending task ID. (HTTP 409)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 422
        WHEN: Invalid `indexName` path value. (HTTP 422)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 429
        WHEN: Per-collection cap of concurrent active reindex tasks reached. (HTTP 429)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 500
        WHEN: An error occurred. (HTTP 500)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 503
        WHEN: Cluster service unavailable, or an in-flight task's payload cannot be parsed so conflict-freedom cannot be proven. (HTTP 503)
    CANONICAL_ID: weaviate.property.rebuild.create
  weaviate.property.index.cancel:
    SUMMARY: Cancel the in-flight reindex task on a property's inverted index
    DESC: "Cancels the in-flight reindex task targeting this property's index. No request body. Idempotent: succeeds whether or not a task was in flight (a `202` with `{\"status\":\"NO_OP\"}` is returned when there is nothing to cancel). `indexName` accepts `rangeable` as an alias for `rangeFilters`."
    HTTP:
      METHOD: POST
      ENDPOINT: /schema/{className}/properties/{propertyName}/index/{indexName}/cancel
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - {}
      - oidc:
          type: oauth2
    EXECUTION:
      KIND: http
      MODE: async
    INPUTS:
      - className:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - propertyName:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - indexName:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
          ENUM:
            - filterable
            - searchable
            - rangeFilters
            - rangeable
    RETURNS:
      - RETURNTYPE: STRUCT(IndexUpdateResponse)
        RETURNVAR: weaviate_property_index_cancel_202
        STATUS: 202
    ERRORS:
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized or invalid credentials. (HTTP 401)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 404
        WHEN: Unknown collection or property. "Nothing to cancel" is NOT a 404 — it returns 202 with status NO_OP. (HTTP 404)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 422
        WHEN: Invalid `indexName` path value. (HTTP 422)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 500
        WHEN: An error occurred. (HTTP 500)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 503
        WHEN: Cluster service unavailable. (HTTP 503)
    CANONICAL_ID: weaviate.property.index.cancel
  weaviate.property.tokenize.create:
    SUMMARY: Tokenize text using a property's configuration
    DESC: Tokenizes the provided text using the tokenization method configured for the specified property. This endpoint automatically applies the property's tokenization setting and the collection's stopword configuration, making it useful for understanding exactly how text will be processed for a given property during indexing and querying.
    HTTP:
      METHOD: POST
      ENDPOINT: /schema/{className}/properties/{propertyName}/tokenize
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
