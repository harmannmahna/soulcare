      TYPE: STRUCT(WhereFilterGeoRange_distance)
      REQUIRED: false
  Tenant:
    - name: name
      TYPE: STRING
      REQUIRED: false
      comment: The name of the tenant (required).
    - name: activityStatus
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - ACTIVE
        - INACTIVE
        - OFFLOADED
        - OFFLOADING
        - ONLOADING
        - HOT
        - COLD
        - FROZEN
        - FREEZING
        - UNFREEZING
      comment: "The activity status of the tenant, which determines if it is queryable and where its data is stored.<br/><br/><b>Available Statuses:</b><br/>- `ACTIVE`: The tenant is fully operational and ready for queries. Data is stored on local, hot storage.<br/>- `INACTIVE`: The tenant is not queryable. Data is stored locally.<br/>- `OFFLOADED`: The tenant is inactive and its data is stored in a remote cloud backend.<br/><br/><b>Usage Rules:</b><br/>- <b>On Create:</b> This field is optional and defaults to `ACTIVE`. Allowed values are `ACTIVE` and `INACTIVE`.<br/>- <b>On Update:</b> This field is required. Allowed values are `ACTIVE`, `INACTIVE`, and `OFFLOADED`.<br/><br/><b>Read-Only Statuses:</b><br/>The following statuses are set by the server and indicate a tenant is transitioning between states:<br/>- `OFFLOADING`<br/>- `ONLOADING`<br/><br/><b>Note on Deprecated Names:</b><br/>For backward compatibility, deprecated names are still accepted and are mapped to their modern equivalents: `HOT` (now `ACTIVE`), `COLD` (now `INACTIVE`), `FROZEN` (now `OFFLOADED`), `FREEZING` (now `OFFLOADING`), `UNFREEZING` (now `ONLOADING`)."
  Alias:
    - name: alias
      TYPE: STRING
      REQUIRED: false
      comment: The unique name of the alias that serves as an alternative identifier for the collection.
    - name: class
      TYPE: STRING
      REQUIRED: false
      comment: The name of the collection (class) to which this alias is mapped.
  AliasResponse:
    - name: aliases
      TYPE: "[]STRUCT(Alias)"
      REQUIRED: false
      comment: Array of alias objects, each containing an alias-to-collection mapping.
  Namespace:
    - name: name
      TYPE: STRING
      REQUIRED: false
      comment: The unique name of the namespace.
    - name: home_node
      TYPE: STRING
      REQUIRED: false
      comment: The cluster node where this namespace's shards are placed. Set at create time and updatable later. Updating it only affects future placement decisions; existing live shards are not moved.
    - name: state
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - active
        - suspended
        - resuming
        - deleting
      comment: "Lifecycle state. \"active\" namespaces accept all operations. \"suspended\" namespaces reject new classes, aliases, users, roles, and role assignments, and their users can no longer authenticate; everything the namespace already owns is retained. \"resuming\" namespaces are on their way back to \"active\" and are still restricted the same way. \"deleting\" namespaces are being removed: new classes, aliases, and users can no longer be created in the namespace, and the namespace itself disappears once removal completes."
  NamespaceCreateRequest:
    - name: home_node
      TYPE: STRING
      REQUIRED: false
      comment: Optional. Cluster node to place this namespace's shards on. Must be a current storage candidate. When omitted, the cluster picks one.
  NamespaceUpdateRequest:
    - name: home_node
      TYPE: STRING
      REQUIRED: true
      comment: Cluster node to use for future placements in this namespace. Must be a current storage candidate. Existing live shards are not moved.
  SearchRerank:
    - name: property
      TYPE: STRING
      REQUIRED: true
      comment: The property to rerank on.
    - name: query
      TYPE: STRING
      REQUIRED: false
      comment: The query to rerank with. Defaults to the search query.
  SearchNearTextRequest:
    - name: where
      TYPE: STRUCT(WhereFilter)
      REQUIRED: false
    - name: limit
      TYPE: INT
      REQUIRED: false
      FORMAT: int64
      NULLABLE: true
      comment: The maximum number of objects to return. Omitted or `0` falls back to the server default (`QUERY_DEFAULTS_LIMIT`); a value above `QUERY_MAXIMUM_RESULTS` is rejected.
    - name: offset
      TYPE: INT
      REQUIRED: false
      FORMAT: int64
      NULLABLE: true
      comment: The number of objects to skip before returning results. Used with `limit` for pagination.
    - name: autoLimit
      TYPE: INT
      REQUIRED: false
      FORMAT: int64
      NULLABLE: true
      comment: Cut results off at the first steep drop in score (autocut). The value is the number of score jumps to allow before cutting.
    - name: returnProperties
      TYPE: "[]STRING"
      REQUIRED: false
      comment: The properties to return. A dot-path selects one hop across a reference (e.g. `hasAuthor.name`). Omitted returns all non-reference, non-blob properties; an empty array returns no properties.
    - name: returnMetadata
      TYPE: "[]STRING"
      REQUIRED: false
      comment: The retrieval metadata to return under each result's `metadata` key. The object `id` is always returned as each result's `id` field. Omitted or empty returns no `metadata` block.
    - name: tenant
      TYPE: STRING
      REQUIRED: false
      comment: The tenant to search in a multi-tenant collection.
    - name: consistencyLevel
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - ONE
        - QUORUM
        - ALL
      comment: The consistency level for the read.
    - name: singlePrompt
      TYPE: STRING
      REQUIRED: false
      NULLABLE: true
      comment: Reserved for per-object retrieval-augmented generation. Returns 422 (not yet supported).
    - name: groupedTask
      TYPE: STRING
      REQUIRED: false
      NULLABLE: true
      comment: Reserved for grouped retrieval-augmented generation. Returns 422 (not yet supported).
    - name: groupBy
      TYPE: STRING
      REQUIRED: false
      NULLABLE: true
      comment: Reserved for grouped search. Returns 422 (not yet supported).
    - name: numberOfGroups
      TYPE: INT
      REQUIRED: false
      FORMAT: int64
      NULLABLE: true
      comment: Reserved for grouped search. Returns 422 (not yet supported).
    - name: objectsPerGroup
      TYPE: INT
      REQUIRED: false
      FORMAT: int64
      NULLABLE: true
      comment: Reserved for grouped search. Returns 422 (not yet supported).
    - name: rerank
      TYPE: STRUCT(SearchRerank)
      REQUIRED: false
    - name: query
      TYPE: "[]STRING"
      REQUIRED: true
      comment: The concept(s) to search for, as an array of strings. Multiple entries perform a multi-concept search. A single concept is a one-element array, e.g. `["space opera"]`.
    - name: certainty
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float64
      NULLABLE: true
      comment: Minimum normalized certainty of a match. Only for cosine-distance vector indexes. Mutually exclusive with `distance`.
    - name: distance
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float64
      NULLABLE: true
      comment: Maximum vector distance of a match. Mutually exclusive with `certainty`.
    - name: targetVector
      TYPE: STRING
      REQUIRED: false
      comment: The named vector to search. Required when the collection has more than one named vector.
  SearchResponse:
    - name: results
      TYPE: "[]STRUCT(SearchResultObject)"
      REQUIRED: true
      comment: The matched objects, ordered by relevance.
    - name: tookMs
      TYPE: INT
      REQUIRED: true
      FORMAT: int64
      comment: Server-side processing time in milliseconds.
  SearchResultMetadata:
    - name: distance
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float
      NULLABLE: true
      comment: The vector distance between the hit and the query.
    - name: certainty
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      NULLABLE: true
      comment: The normalized certainty of the hit. Only computable on cosine-distance vector indexes.
    - name: score
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float
      NULLABLE: true
      comment: The relevance score of the hit.
    - name: explainScore
      TYPE: STRING
      REQUIRED: false
      NULLABLE: true
      comment: An explanation of how the score was computed.
    - name: creationTime
      TYPE: INT
      REQUIRED: false
      FORMAT: int64
      NULLABLE: true
      comment: The object's creation time, as epoch milliseconds.
    - name: lastUpdateTime
      TYPE: INT
      REQUIRED: false
      FORMAT: int64
      NULLABLE: true
      comment: The object's last-update time, as epoch milliseconds.
  SearchResultObject:
    - name: id
      TYPE: STRING
      REQUIRED: true
      FORMAT: uuid
      comment: The object's UUID. Always returned.
    - name: properties
      TYPE: map[STRING]ANY
      REQUIRED: true
