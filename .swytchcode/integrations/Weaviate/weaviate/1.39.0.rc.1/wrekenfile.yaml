        STATUS: 401
        WHEN: Unauthorized or invalid credentials. (HTTP 401)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 404
        WHEN: Not Found. (HTTP 404)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 422
        WHEN: Invalid request for node status. (HTTP 422)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 500
        WHEN: An internal server error occurred while retrieving node status. Check the ErrorResponse for details. (HTTP 500)
    CANONICAL_ID: weaviate.node.list
  weaviate.node.get:
    SUMMARY: Get node status by collection
    DESC: Retrieves status information only for the nodes that host shards for the specified collection (`className`). Use the `output` query parameter to control the level of detail.
    HTTP:
      METHOD: GET
      ENDPOINT: /nodes/{className}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - {}
      - oidc:
          type: oauth2
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - className:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - shardName:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - output:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          DEFAULT: minimal
    RETURNS:
      - RETURNTYPE: STRUCT(NodesStatusResponse)
        RETURNVAR: weaviate_node_get
        STATUS: 200
    ERRORS:
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized or invalid credentials. (HTTP 401)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 404
        WHEN: Not Found. (HTTP 404)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 422
        WHEN: Invalid request for node status. (HTTP 422)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 500
        WHEN: An internal server error occurred while retrieving node status for the collection. Check the ErrorResponse for details. (HTTP 500)
    CANONICAL_ID: weaviate.node.get
  weaviate.task.list:
    SUMMARY: Lists all distributed tasks in the cluster
    HTTP:
      METHOD: GET
      ENDPOINT: /tasks
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - {}
      - oidc:
          type: oauth2
    EXECUTION:
      KIND: http
      MODE: sync
    RETURNS:
      - RETURNTYPE: map[STRING][]STRUCT(DistributedTask)
        RETURNVAR: weaviate_task_list
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 403
        WHEN: Unauthorized or invalid credentials. (HTTP 403)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 500
        WHEN: An internal server error occurred while retrieving distributed tasks. Check the ErrorResponse for details. (HTTP 500)
    CANONICAL_ID: weaviate.task.list
  weaviate.classification.create:
    SUMMARY: Start a classification
    DESC: Initiates a background classification task based on the provided parameters. Use the GET /classifications/{id} endpoint to monitor the status and retrieve results.
    HTTP:
      METHOD: POST
      ENDPOINT: /classifications/
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(Classification)
    SECURITY:
      - {}
      - oidc:
          type: oauth2
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(Classification)
          REQUIRED: true
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(Classification)
        RETURNVAR: weaviate_classification_create_201
        STATUS: 201
    ERRORS:
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 400
        WHEN: Invalid request body or parameters. (HTTP 400)
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized or invalid credentials. (HTTP 401)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 410
        WHEN: Endpoint not available in the current cluster configuration. (HTTP 410)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 500
        WHEN: An internal server error occurred while starting the classification task. Check the ErrorResponse for details. (HTTP 500)
    CANONICAL_ID: weaviate.classification.create
  weaviate.classification.get:
    SUMMARY: Get classification status
    DESC: Retrieves the status, metadata, and results (if completed) of a classification task identified by its unique ID.
    HTTP:
      METHOD: GET
      ENDPOINT: /classifications/{id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - {}
      - oidc:
          type: oauth2
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(Classification)
        RETURNVAR: weaviate_classification_get
        STATUS: 200
    ERRORS:
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized or invalid credentials. (HTTP 401)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: ANY
        STATUS: 404
        WHEN: Classification with the given ID not found. (HTTP 404)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 410
        WHEN: Endpoint not available in the current cluster configuration. (HTTP 410)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 500
        WHEN: An internal server error occurred while retrieving the classification status. Check the ErrorResponse for details. (HTTP 500)
    CANONICAL_ID: weaviate.classification.get
  weaviate.mcp.create:
    SUMMARY: MCP Streamable HTTP endpoint
    DESC: MCP Streamable HTTP endpoint. Handles JSON-RPC requests for tool discovery and invocation.
    HTTP:
      METHOD: POST
      ENDPOINT: /mcp
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
