      KIND: http
      MODE: sync
    CANONICAL_ID: weaviate.mcp.create
  weaviate.mcp.list:
    SUMMARY: Opens an SSE stream for receiving MCP server-sent events.
    DESC: Opens an SSE stream for receiving MCP server-sent events.
    HTTP:
      METHOD: GET
      ENDPOINT: /mcp
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - {}
      - oidc:
          type: oauth2
    EXECUTION:
      KIND: http
      MODE: sync
    CANONICAL_ID: weaviate.mcp.list
  weaviate.mcp.delete:
    SUMMARY: Terminates an MCP session.
    DESC: Terminates an MCP session.
    HTTP:
      METHOD: DELETE
      ENDPOINT: /mcp
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - {}
      - oidc:
          type: oauth2
    EXECUTION:
      KIND: http
      MODE: sync
    CANONICAL_ID: weaviate.mcp.delete
  weaviate.near_text.create:
    SUMMARY: Search a collection with near-text
    DESC: Performs a semantic (near-text) search over the objects of a collection. The query text is vectorized server-side by the collection's vectorizer module and the closest objects are returned, each as an envelope of its `id`, the selected `properties`, the selected `references` and, when requested, its retrieval `metadata`.
    HTTP:
      METHOD: POST
      ENDPOINT: /search/{collection}/near-text
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(SearchNearTextRequest)
    SECURITY:
      - {}
      - oidc:
          type: oauth2
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - collection:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - body:
          TYPE: STRUCT(SearchNearTextRequest)
          REQUIRED: true
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(SearchResponse)
        RETURNVAR: weaviate_near-text_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 400
        WHEN: An invalid parameter value (e.g. empty query, negative paging, unknown property) or an unparseable request body. (HTTP 400)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 401
        WHEN: Unauthorized or invalid credentials. (HTTP 401)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 404
        WHEN: Unknown collection or tenant. (HTTP 404)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 422
        WHEN: "Either a request-schema violation (a missing required field such as `query`, or an invalid enum value), or a well-formed request that cannot run: no vectorizer module is configured for the collection, targetVector is missing on a multi-named-vector collection, certainty is used on a non-cosine index, a reserved (not yet supported) parameter is present, the tenant usage does not match the collection's multi-tenancy configuration, a where filter targets a property whose inverted index is disabled, or the experimental REST Search API is not enabled (set EXPERIMENTAL_REST_SEARCH_ENABLED=true). (HTTP 422)"
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 429
        WHEN: The server's query rate limit was reached; retry later. (HTTP 429)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 500
        WHEN: An error has occurred while trying to fulfill the request. Most likely the ErrorResponse will contain more information about the error. (HTTP 500)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 502
        WHEN: The embedding provider failed to vectorize the query; the search cannot run. (HTTP 502)
      - TYPE: STRUCT(ErrorResponse)
        STATUS: 503
        WHEN: The server is in an operational mode that blocks searches (e.g. WRITE_ONLY); retry once the server returns to normal operation. (HTTP 503)
    CANONICAL_ID: weaviate.near-text.create
STRUCTS:
  UserOwnInfo:
    - name: groups
      TYPE: "[]STRING"
      REQUIRED: false
      comment: The groups associated with the user.
    - name: roles
      TYPE: "[]STRUCT(Role)"
      REQUIRED: false
    - name: username
      TYPE: STRING
      REQUIRED: true
      comment: The name (ID) of the user.
  DBUserInfo:
    - name: roles
      TYPE: "[]STRING"
      REQUIRED: true
      comment: The roles associated with the user.
    - name: userId
      TYPE: STRING
      REQUIRED: true
      comment: The name (ID) of the user.
    - name: dbUserType
      TYPE: STRING
      REQUIRED: true
      ENUM:
        - db_user
        - db_env_user
      comment: Type of the returned user.
    - name: active
      TYPE: BOOL
      REQUIRED: true
      comment: Activity status of the returned user.
    - name: createdAt
      TYPE: TIMESTAMP
      REQUIRED: false
      FORMAT: date-time
      comment: "Date and time in ISO 8601 format: YYYY-MM-DDTHH:MM:SSZ."
    - name: apiKeyFirstLetters
      TYPE: STRING
      REQUIRED: false
      MAX_LENGTH: 3
      comment: First 3 letters of the associated API key.
    - name: lastUsedAt
      TYPE: TIMESTAMP
      REQUIRED: false
      FORMAT: date-time
      comment: "Date and time in ISO 8601 format: YYYY-MM-DDTHH:MM:SSZ."
    - name: namespace
      TYPE: STRING
      REQUIRED: false
      comment: The namespace this user is bound to. Only populated for callers with global-operator privileges; omitted otherwise.
  UserApiKey:
    - name: apikey
      TYPE: STRING
      REQUIRED: true
      comment: The API key associated with the user.
  Role:
    - name: name
      TYPE: STRING
      REQUIRED: true
      comment: The name (ID) of the role.
    - name: permissions
      TYPE: "[]STRUCT(Permission)"
      REQUIRED: true
  Permission_backups:
    - name: collection
      TYPE: STRING
      REQUIRED: false
      DEFAULT: "*"
      comment: A string that specifies which collections this permission applies to. Can be an exact collection name or a regex pattern. The default value `*` applies the permission to all collections.
  Permission_data:
    - name: collection
      TYPE: STRING
      REQUIRED: false
      DEFAULT: "*"
      comment: A string that specifies which collections this permission applies to. Can be an exact collection name or a regex pattern. The default value `*` applies the permission to all collections.
    - name: tenant
      TYPE: STRING
      REQUIRED: false
      DEFAULT: "*"
      comment: A string that specifies which tenants this permission applies to. Can be an exact tenant name or a regex pattern. The default value `*` applies the permission to all tenants.
    - name: object
      TYPE: STRING
      REQUIRED: false
      DEFAULT: "*"
      comment: A string that specifies which objects this permission applies to. Can be an exact object ID or a regex pattern. The default value `*` applies the permission to all objects.
  Permission_nodes:
    - name: verbosity
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - verbose
        - minimal
      DEFAULT: minimal
      comment: Whether to allow (verbose) returning shards and stats data in the response.
    - name: collection
      TYPE: STRING
      REQUIRED: false
      DEFAULT: "*"
      comment: A string that specifies which collections this permission applies to. Can be an exact collection name or a regex pattern. The default value `*` applies the permission to all collections.
  Permission_users:
    - name: users
      TYPE: STRING
      REQUIRED: false
      DEFAULT: "*"
      comment: A string that specifies which users this permission applies to. Can be an exact user name or a regex pattern. The default value `*` applies the permission to all users.
  Permission_groups:
    - name: group
      TYPE: STRING
      REQUIRED: false
      DEFAULT: "*"
      comment: A string that specifies which groups this permission applies to. Can be an exact group name or a regex pattern. The default value `*` applies the permission to all groups.
    - name: groupType
      TYPE: STRING
      REQUIRED: false
  Permission_tenants:
    - name: collection
      TYPE: STRING
      REQUIRED: false
      DEFAULT: "*"
      comment: A string that specifies which collections this permission applies to. Can be an exact collection name or a regex pattern. The default value `*` applies the permission to all collections.
    - name: tenant
      TYPE: STRING
      REQUIRED: false
      DEFAULT: "*"
      comment: A string that specifies which tenants this permission applies to. Can be an exact tenant name or a regex pattern. The default value `*` applies the permission to all tenants.
  Permission_roles:
    - name: role
      TYPE: STRING
      REQUIRED: false
      DEFAULT: "*"
      comment: A string that specifies which roles this permission applies to. Can be an exact role name or a regex pattern. The default value `*` applies the permission to all roles.
    - name: scope
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - all
        - match
      DEFAULT: match
      comment: Set the scope for the manage role permission.
  Permission_collections:
    - name: collection
      TYPE: STRING
      REQUIRED: false
      DEFAULT: "*"
      comment: A string that specifies which collections this permission applies to. Can be an exact collection name or a regex pattern. The default value `*` applies the permission to all collections.
  Permission_replicate:
    - name: collection
      TYPE: STRING
      REQUIRED: false
      DEFAULT: "*"
      comment: string or regex. if a specific collection name, if left empty it will be ALL or *
    - name: shard
      TYPE: STRING
      REQUIRED: false
      DEFAULT: "*"
      comment: string or regex. if a specific shard name, if left empty it will be ALL or *
  Permission_aliases:
    - name: collection
      TYPE: STRING
      REQUIRED: false
      DEFAULT: "*"
      comment: A string that specifies which collections this permission applies to. Can be an exact collection name or a regex pattern. The default value `*` applies the permission to all collections.
    - name: alias
      TYPE: STRING
      REQUIRED: false
      DEFAULT: "*"
      comment: A string that specifies which aliases this permission applies to. Can be an exact alias name or a regex pattern. The default value `*` applies the permission to all aliases.
  Permission_namespaces:
    - name: namespace
      TYPE: STRING
      REQUIRED: false
      DEFAULT: "*"
      comment: A string that specifies which namespaces this permission applies to. Can be an exact namespace name or a regex pattern. The default value `*` applies the permission to all namespaces.
  Permission:
    - name: backups
      TYPE: STRUCT(Permission_backups)
      REQUIRED: false
      comment: Resources applicable for backup actions.
    - name: data
      TYPE: STRUCT(Permission_data)
      REQUIRED: false
      comment: Resources applicable for data actions.
    - name: nodes
      TYPE: STRUCT(Permission_nodes)
      REQUIRED: false
      comment: Resources applicable for cluster actions.
    - name: users
      TYPE: STRUCT(Permission_users)
      REQUIRED: false
      comment: Resources applicable for user actions.
    - name: groups
      TYPE: STRUCT(Permission_groups)
      REQUIRED: false
      comment: Resources applicable for group actions.
    - name: tenants
      TYPE: STRUCT(Permission_tenants)
      REQUIRED: false
      comment: Resources applicable for tenant actions.
    - name: roles
      TYPE: STRUCT(Permission_roles)
      REQUIRED: false
      comment: Resources applicable for role actions.
    - name: collections
      TYPE: STRUCT(Permission_collections)
      REQUIRED: false
      comment: Resources applicable for collection and/or tenant actions.
    - name: replicate
      TYPE: STRUCT(Permission_replicate)
      REQUIRED: false
      comment: resources applicable for replicate actions
    - name: aliases
      TYPE: STRUCT(Permission_aliases)
      REQUIRED: false
      comment: Resource definition for alias-related actions and permissions. Used to specify which aliases and collections can be accessed or modified.
    - name: namespaces
      TYPE: STRUCT(Permission_namespaces)
      REQUIRED: false
      comment: Resources applicable for namespace actions.
    - name: action
      TYPE: STRING
      REQUIRED: true
      ENUM:
        - manage_backups
        - read_cluster
        - create_data
        - read_data
        - update_data
        - delete_data
        - read_nodes
        - create_roles
        - read_roles
        - update_roles
        - delete_roles
        - create_collections
        - read_collections
        - update_collections
        - delete_collections
        - assign_and_revoke_users
        - create_users
        - read_users
        - update_users
        - delete_users
        - create_tenants
        - read_tenants
        - update_tenants
        - delete_tenants
        - create_replicate
        - read_replicate
        - update_replicate
        - delete_replicate
        - create_aliases
        - read_aliases
        - update_aliases
        - delete_aliases
        - assign_and_revoke_groups
        - read_groups
        - create_mcp
        - read_mcp
        - update_mcp
        - manage_namespaces
      comment: Allowed actions in weaviate.
  Link:
    - name: href
      TYPE: STRING
      REQUIRED: false
      comment: Target of the link.
    - name: rel
      TYPE: STRING
      REQUIRED: false
      comment: Relationship if both resources are related, e.g. 'next', 'previous', 'parent', etc.
    - name: name
      TYPE: STRING
      REQUIRED: false
      comment: Human readable name of the resource group.
    - name: documentationHref
      TYPE: STRING
      REQUIRED: false
      comment: Weaviate documentation about this resource group.
  Vector:
    - name: value
      TYPE: ANY
      REQUIRED: false
  Deprecation:
    - name: id
      TYPE: STRING
      REQUIRED: false
      comment: The id that uniquely identifies this particular deprecation (mostly used internally).
    - name: status
      TYPE: STRING
      REQUIRED: false
      comment: Whether the problematic API functionality is deprecated (planned to be removed) or already removed.
    - name: apiType
      TYPE: STRING
      REQUIRED: false
      comment: "Describes which API is affected, usually one of: REST, GraphQL and gRPC."
    - name: msg
      TYPE: STRING
      REQUIRED: false
      comment: What this deprecation is about.
    - name: mitigation
      TYPE: STRING
      REQUIRED: false
      comment: User-required object to not be affected by the (planned) removal.
    - name: sinceVersion
      TYPE: STRING
      REQUIRED: false
      comment: The deprecation was introduced in this version.
    - name: plannedRemovalVersion
      TYPE: STRING
      REQUIRED: false
      comment: A best-effort guess of which upcoming version will remove the feature entirely.
    - name: removedIn
      TYPE: STRING
      REQUIRED: false
      NULLABLE: true
      comment: If the feature has already been removed, it was removed in this version.
    - name: removedTime
      TYPE: TIMESTAMP
      REQUIRED: false
      FORMAT: date-time
      NULLABLE: true
      comment: If the feature has already been removed, it was removed at this timestamp.
    - name: sinceTime
      TYPE: TIMESTAMP
      REQUIRED: false
      FORMAT: date-time
      comment: The deprecation was introduced at this timestamp.
    - name: locations
      TYPE: "[]STRING"
      REQUIRED: false
      comment: The locations within the specified API affected by this deprecation.
  ErrorResponse_error_Item:
    - name: message
      TYPE: STRING
      REQUIRED: false
  ErrorResponse:
    - name: error
      TYPE: "[]STRUCT(ErrorResponse_error_Item)"
      REQUIRED: false
  IndexStatusResponse:
    - name: collection
      TYPE: STRING
      REQUIRED: false
    - name: properties
      TYPE: "[]STRUCT(PropertyIndexStatus)"
      REQUIRED: false
  PropertyIndexStatus:
    - name: name
      TYPE: STRING
      REQUIRED: false
    - name: dataType
      TYPE: STRING
      REQUIRED: false
    - name: description
      TYPE: STRING
      REQUIRED: false
    - name: indexes
      TYPE: "[]STRUCT(IndexStatus)"
      REQUIRED: false
  IndexStatus:
    - name: type
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - filterable
        - searchable
        - rangeFilters
      comment: Canonical inverted-index type. Always one of `filterable`, `searchable`, `rangeFilters` — never the `rangeable` write-path alias.
    - name: status
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - ready
        - indexing
        - pending
        - failed
        - cancelled
    - name: progress
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float
    - name: taskId
      TYPE: STRING
      REQUIRED: false
      comment: ID of the reindex task driving this index entry. Present on every task-driven entry (`pending`, `indexing`, `failed`, `cancelled`, and the finalize-window override); absent on a plain `ready` entry. A coupled searchable+filterable tokenization migration reports the same `taskId` on both affected entries.
    - name: tokenization
      TYPE: STRING
      REQUIRED: false
    - name: targetTokenization
      TYPE: STRING
      REQUIRED: false
    - name: algorithm
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - wand
        - blockmax
      comment: BM25 algorithm currently backing this searchable index. 'wand' is the legacy map-based bucket strategy; 'blockmax' is the Block Max WAND inverted strategy. Only populated for `type=searchable` entries. Not populated for filterable or rangeable indexes.
    - name: targetAlgorithm
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - wand
        - blockmax
      comment: BM25 algorithm this searchable index is being rebuilt onto. Populated only while an in-flight rebuild is changing the algorithm; mirrors `targetTokenization` for the change-tokenization verb. Today the only supported transition is wand -> blockmax.
  IndexUpsertRequest:
    - name: tokenization
      TYPE: STRING
      REQUIRED: false
      comment: Target tokenization for a `searchable` or `filterable` index. Required when creating a `searchable` index; optional otherwise (omitted = keep the current value). On `filterable` creation it must be omitted or equal the property's current tokenization.
    - name: algorithm
      TYPE: STRING
      REQUIRED: false
      comment: Target BM25 algorithm for a `searchable` index. Only `blockmax` is a valid target (input aliases `block-max`, `block_max`, `blockmaxwand`, `bmw` are accepted case-insensitively). From WAND this triggers the Map → BlockMax migration; on an already-`blockmax` index it is a NO_OP. `wand` is rejected (deprecated); downgrade is intentionally not supported.
  IndexUpdateResponse:
    - name: taskId
      TYPE: STRING
      REQUIRED: false
    - name: status
      TYPE: STRING
      REQUIRED: false
  UsageLimitExceededResponse:
    - name: errorCode
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - USAGE_LIMIT_EXCEEDED
      comment: Machine-stable identifier. Always `USAGE_LIMIT_EXCEEDED` for this response.
    - name: limit
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - objects
        - collections
        - tenants
        - shards
      comment: Which limit was hit.
    - name: value
      TYPE: INT
      REQUIRED: false
      FORMAT: int64
      comment: The configured threshold value (the cap, not the current count).
    - name: message
      TYPE: STRING
      REQUIRED: false
      comment: Human-readable message rendered from the `USAGE_LIMITS_ERROR_MESSAGE` template with `{limit}` and `{value}` placeholders substituted.
  RestrictionViolationResponse_error_Item:
    - name: message
      TYPE: STRING
      REQUIRED: false
  RestrictionViolationResponse:
    - name: error
      TYPE: "[]STRUCT(RestrictionViolationResponse_error_Item)"
      REQUIRED: false
      comment: Legacy ErrorResponse-style error list, populated for non-restriction 422 errors.
    - name: errorCode
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - CONFIG_NOT_ALLOWED
      comment: Machine-stable identifier. Set to `CONFIG_NOT_ALLOWED` for restriction violations; omitted otherwise.
    - name: restriction
      TYPE: STRING
      REQUIRED: false
      ENUM:
