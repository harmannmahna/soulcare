  InvideoTiming:
    - name: durationMs
      TYPE: STRING
      REQUIRED: false
      FORMAT: uint64
      comment: Defines the duration in milliseconds for which the promotion should be displayed. If missing, the client should use the default.
    - name: offsetMs
      TYPE: STRING
      REQUIRED: false
      FORMAT: uint64
      comment: Defines the time at which the promotion will appear. Depending on the value of type the value of the offsetMs field will represent a time offset from the start or from the end of the video, expressed in milliseconds.
    - name: type
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - offsetFromStart
        - offsetFromEnd
      comment: Describes a timing type. If the value is offsetFromStart, then the offsetMs field represents an offset from the start of the video. If the value is offsetFromEnd, then the offsetMs field represents an offset from the end of the video.
