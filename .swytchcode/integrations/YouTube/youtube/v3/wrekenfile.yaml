      TYPE: STRING
      REQUIRED: false
      comment: The token that can be used as the value of the pageToken parameter to retrieve the previous page in the result set.
    - name: tokenPagination
      TYPE: STRUCT(TokenPagination)
      REQUIRED: false
      DEPRECATED: true
    - name: visitorId
      TYPE: STRING
      REQUIRED: false
      DEPRECATED: true
      comment: The visitorId identifies the visitor.
  ActivitySnippet:
    - name: channelId
      TYPE: STRING
      REQUIRED: false
      comment: The ID that YouTube uses to uniquely identify the channel associated with the activity.
    - name: channelTitle
      TYPE: STRING
      REQUIRED: false
      comment: Channel title for the channel responsible for this activity
    - name: description
      TYPE: STRING
      REQUIRED: false
      comment: The description of the resource primarily associated with the activity. @mutable youtube.activities.insert
