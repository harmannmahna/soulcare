      comment: The token that can be used as the value of the pageToken parameter to retrieve the next page in the result set.
    - name: pageInfo
      TYPE: STRUCT(PageInfo)
      REQUIRED: false
      comment: General pagination information.
    - name: prevPageToken
      TYPE: STRING
      REQUIRED: false
      comment: The token that can be used as the value of the pageToken parameter to retrieve the previous page in the result set.
    - name: tokenPagination
      TYPE: STRUCT(TokenPagination)
      REQUIRED: false
      DEPRECATED: true
    - name: visitorId
      TYPE: STRING
      REQUIRED: false
      DEPRECATED: true
      comment: The visitorId identifies the visitor.
  VideoCategorySnippet:
    - name: assignable
      TYPE: BOOL
      REQUIRED: false
    - name: channelId
      TYPE: STRING
      REQUIRED: false
      DEFAULT: UCBR8-60-B28hp2BmDPdntcQ
      comment: The YouTube channel that created the video category.
    - name: title
      TYPE: STRING
      REQUIRED: false
      comment: The video category's title.
  VideoContentDetails:
    - name: caption
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - "true"
        - "false"
      comment: The value of captions indicates whether the video has captions or not.
    - name: contentRating
      TYPE: STRUCT(ContentRating)
      REQUIRED: false
      comment: Specifies the ratings that the video received under various rating schemes.
    - name: countryRestriction
      TYPE: STRUCT(AccessPolicy)
      REQUIRED: false
      comment: The countryRestriction object contains information about the countries where a video is (or is not) viewable.
    - name: definition
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - sd
        - hd
      comment: The value of definition indicates whether the video is available in high definition or only in standard definition.
    - name: dimension
      TYPE: STRING
      REQUIRED: false
      comment: The value of dimension indicates whether the video is available in 3D or in 2D.
    - name: duration
      TYPE: STRING
      REQUIRED: false
      comment: "The length of the video. The tag value is an ISO 8601 duration in the format PT#M#S, in which the letters PT indicate that the value specifies a period of time, and the letters M and S refer to length in minutes and seconds, respectively. The # characters preceding the M and S letters are both integers that specify the number of minutes (or seconds) of the video. For example, a value of PT15M51S indicates that the video is 15 minutes and 51 seconds long."
    - name: hasCustomThumbnail
      TYPE: BOOL
      REQUIRED: false
      comment: Indicates whether the video uploader has provided a custom thumbnail image for the video. This property is only visible to the video uploader.
    - name: licensedContent
      TYPE: BOOL
      REQUIRED: false
      comment: The value of is_license_content indicates whether the video is licensed content.
    - name: projection
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - rectangular
        - "360"
      comment: Specifies the projection format of the video.
    - name: regionRestriction
      TYPE: STRUCT(VideoContentDetailsRegionRestriction)
      REQUIRED: false
      DEPRECATED: true
      comment: The regionRestriction object contains information about the countries where a video is (or is not) viewable. The object will contain either the contentDetails.regionRestriction.allowed property or the contentDetails.regionRestriction.blocked property.
  VideoContentDetailsRegionRestriction:
    - name: allowed
      TYPE: "[]STRING"
      REQUIRED: false
      comment: A list of region codes that identify countries where the video is viewable. If this property is present and a country is not listed in its value, then the video is blocked from appearing in that country. If this property is present and contains an empty list, the video is blocked in all countries.
    - name: blocked
      TYPE: "[]STRING"
      REQUIRED: false
      comment: A list of region codes that identify countries where the video is blocked. If this property is present and a country is not listed in its value, then the video is viewable in that country. If this property is present and contains an empty list, the video is viewable in all countries.
  VideoFileDetails:
    - name: audioStreams
      TYPE: "[]STRUCT(VideoFileDetailsAudioStream)"
      REQUIRED: false
      comment: A list of audio streams contained in the uploaded video file. Each item in the list contains detailed metadata about an audio stream.
    - name: bitrateBps
      TYPE: STRING
      REQUIRED: false
      FORMAT: uint64
      comment: The uploaded video file's combined (video and audio) bitrate in bits per second.
    - name: container
      TYPE: STRING
      REQUIRED: false
      comment: The uploaded video file's container format.
    - name: creationTime
      TYPE: STRING
      REQUIRED: false
      comment: "The date and time when the uploaded video file was created. The value is specified in ISO 8601 format. Currently, the following ISO 8601 formats are supported: - Date only: YYYY-MM-DD - Naive time: YYYY-MM-DDTHH:MM:SS - Time with timezone: YYYY-MM-DDTHH:MM:SS+HH:MM "
    - name: durationMs
      TYPE: STRING
      REQUIRED: false
      FORMAT: uint64
      comment: The length of the uploaded video in milliseconds.
    - name: fileName
      TYPE: STRING
      REQUIRED: false
      comment: The uploaded file's name. This field is present whether a video file or another type of file was uploaded.
    - name: fileSize
      TYPE: STRING
      REQUIRED: false
      FORMAT: uint64
      comment: The uploaded file's size in bytes. This field is present whether a video file or another type of file was uploaded.
    - name: fileType
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - video
        - audio
        - image
        - archive
        - document
        - project
        - other
      comment: The uploaded file's type as detected by YouTube's video processing engine. Currently, YouTube only processes video files, but this field is present whether a video file or another type of file was uploaded.
    - name: videoStreams
      TYPE: "[]STRUCT(VideoFileDetailsVideoStream)"
      REQUIRED: false
      comment: A list of video streams contained in the uploaded video file. Each item in the list contains detailed metadata about a video stream.
  VideoFileDetailsAudioStream:
    - name: bitrateBps
      TYPE: STRING
      REQUIRED: false
      FORMAT: uint64
      comment: The audio stream's bitrate, in bits per second.
    - name: channelCount
      TYPE: INT
      REQUIRED: false
      FORMAT: uint32
      comment: The number of audio channels that the stream contains.
    - name: codec
      TYPE: STRING
      REQUIRED: false
      comment: The audio codec that the stream uses.
    - name: vendor
      TYPE: STRING
      REQUIRED: false
      comment: A value that uniquely identifies a video vendor. Typically, the value is a four-letter vendor code.
  VideoFileDetailsVideoStream:
    - name: aspectRatio
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      comment: The video content's display aspect ratio, which specifies the aspect ratio in which the video should be displayed.
    - name: bitrateBps
      TYPE: STRING
      REQUIRED: false
      FORMAT: uint64
      comment: The video stream's bitrate, in bits per second.
    - name: codec
      TYPE: STRING
      REQUIRED: false
      comment: The video codec that the stream uses.
    - name: frameRateFps
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      comment: The video stream's frame rate, in frames per second.
    - name: heightPixels
      TYPE: INT
      REQUIRED: false
      FORMAT: uint32
      comment: The encoded video content's height in pixels.
    - name: rotation
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - none
        - clockwise
        - upsideDown
        - counterClockwise
        - other
      comment: The amount that YouTube needs to rotate the original source content to properly display the video.
    - name: vendor
      TYPE: STRING
      REQUIRED: false
      comment: A value that uniquely identifies a video vendor. Typically, the value is a four-letter vendor code.
    - name: widthPixels
      TYPE: INT
      REQUIRED: false
      FORMAT: uint32
      comment: The encoded video content's width in pixels. You can calculate the video's encoding aspect ratio as width_pixels / height_pixels.
  VideoGetRatingResponse:
    - name: etag
      TYPE: STRING
      REQUIRED: false
      comment: Etag of this resource.
    - name: eventId
      TYPE: STRING
      REQUIRED: false
      DEPRECATED: true
      comment: Serialized EventId of the request which produced this response.
    - name: items
      TYPE: "[]STRUCT(VideoRating)"
      REQUIRED: false
      comment: A list of ratings that match the request criteria.
    - name: kind
      TYPE: STRING
      REQUIRED: false
      DEFAULT: youtube#videoGetRatingResponse
      comment: "Identifies what kind of resource this is. Value: the fixed string \"youtube#videoGetRatingResponse\"."
    - name: visitorId
      TYPE: STRING
      REQUIRED: false
      DEPRECATED: true
      comment: The visitorId identifies the visitor.
  VideoListResponse:
    - name: etag
      TYPE: STRING
      REQUIRED: false
      comment: Etag of this resource.
    - name: eventId
      TYPE: STRING
      REQUIRED: false
      DEPRECATED: true
      comment: Serialized EventId of the request which produced this response.
    - name: items
      TYPE: "[]STRUCT(Video)"
      REQUIRED: false
    - name: kind
      TYPE: STRING
      REQUIRED: false
      DEFAULT: youtube#videoListResponse
      comment: "Identifies what kind of resource this is. Value: the fixed string \"youtube#videoListResponse\"."
    - name: nextPageToken
      TYPE: STRING
      REQUIRED: false
      comment: The token that can be used as the value of the pageToken parameter to retrieve the next page in the result set.
    - name: pageInfo
      TYPE: STRUCT(PageInfo)
      REQUIRED: false
      comment: General pagination information.
    - name: prevPageToken
      TYPE: STRING
      REQUIRED: false
      comment: The token that can be used as the value of the pageToken parameter to retrieve the previous page in the result set.
    - name: tokenPagination
      TYPE: STRUCT(TokenPagination)
      REQUIRED: false
      DEPRECATED: true
    - name: visitorId
      TYPE: STRING
      REQUIRED: false
      DEPRECATED: true
      comment: The visitorId identifies the visitor.
  VideoLiveStreamingDetails:
    - name: activeLiveChatId
      TYPE: STRING
      REQUIRED: false
      comment: The ID of the currently active live chat attached to this video. This field is filled only if the video is a currently live broadcast that has live chat. Once the broadcast transitions to complete this field will be removed and the live chat closed down. For persistent broadcasts that live chat id will no longer be tied to this video but rather to the new video being displayed at the persistent page.
    - name: actualEndTime
      TYPE: TIMESTAMP
      REQUIRED: false
      FORMAT: date-time
      comment: The time that the broadcast actually ended. This value will not be available until the broadcast is over.
    - name: actualStartTime
      TYPE: TIMESTAMP
      REQUIRED: false
      FORMAT: date-time
      comment: The time that the broadcast actually started. This value will not be available until the broadcast begins.
    - name: concurrentViewers
      TYPE: STRING
      REQUIRED: false
      FORMAT: uint64
      comment: The number of viewers currently watching the broadcast. The property and its value will be present if the broadcast has current viewers and the broadcast owner has not hidden the viewcount for the video. Note that YouTube stops tracking the number of concurrent viewers for a broadcast when the broadcast ends. So, this property would not identify the number of viewers watching an archived video of a live broadcast that already ended.
    - name: scheduledEndTime
      TYPE: TIMESTAMP
      REQUIRED: false
      FORMAT: date-time
      comment: The time that the broadcast is scheduled to end. If the value is empty or the property is not present, then the broadcast is scheduled to continue indefinitely.
    - name: scheduledStartTime
      TYPE: TIMESTAMP
      REQUIRED: false
      FORMAT: date-time
      comment: The time that the broadcast is scheduled to begin.
  VideoLocalization:
    - name: description
      TYPE: STRING
      REQUIRED: false
      comment: Localized version of the video's description.
    - name: title
      TYPE: STRING
      REQUIRED: false
      comment: Localized version of the video's title.
  VideoMonetizationDetails:
    - name: access
      TYPE: STRUCT(AccessPolicy)
      REQUIRED: false
      comment: The value of access indicates whether the video can be monetized or not.
  VideoPaidProductPlacementDetails:
    - name: hasPaidProductPlacement
      TYPE: BOOL
      REQUIRED: false
      comment: "This boolean represents whether the video contains Paid Product Placement, Studio equivalent: https://screenshot.googleplex.com/4Me79DE6AfT2ktp.png"
  VideoPlayer:
    - name: embedHeight
      TYPE: STRING
      REQUIRED: false
      FORMAT: int64
    - name: embedHtml
      TYPE: STRING
      REQUIRED: false
      comment: An <iframe> tag that embeds a player that will play the video.
    - name: embedWidth
      TYPE: STRING
      REQUIRED: false
      FORMAT: int64
      comment: The embed width
  VideoProcessingDetails:
    - name: editorSuggestionsAvailability
      TYPE: STRING
      REQUIRED: false
      comment: This value indicates whether video editing suggestions, which might improve video quality or the playback experience, are available for the video. You can retrieve these suggestions by requesting the suggestions part in your videos.list() request.
    - name: fileDetailsAvailability
      TYPE: STRING
      REQUIRED: false
      comment: This value indicates whether file details are available for the uploaded video. You can retrieve a video's file details by requesting the fileDetails part in your videos.list() request.
    - name: processingFailureReason
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - uploadFailed
        - transcodeFailed
        - streamingFailed
        - other
      comment: The reason that YouTube failed to process the video. This property will only have a value if the processingStatus property's value is failed.
    - name: processingIssuesAvailability
      TYPE: STRING
      REQUIRED: false
      comment: This value indicates whether the video processing engine has generated suggestions that might improve YouTube's ability to process the the video, warnings that explain video processing problems, or errors that cause video processing problems. You can retrieve these suggestions by requesting the suggestions part in your videos.list() request.
    - name: processingProgress
      TYPE: STRUCT(VideoProcessingDetailsProcessingProgress)
      REQUIRED: false
      comment: The processingProgress object contains information about the progress YouTube has made in processing the video. The values are really only relevant if the video's processing status is processing.
    - name: processingStatus
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - processing
        - succeeded
        - failed
        - terminated
      comment: The video's processing status. This value indicates whether YouTube was able to process the video or if the video is still being processed.
    - name: tagSuggestionsAvailability
      TYPE: STRING
      REQUIRED: false
      comment: This value indicates whether keyword (tag) suggestions are available for the video. Tags can be added to a video's metadata to make it easier for other users to find the video. You can retrieve these suggestions by requesting the suggestions part in your videos.list() request.
    - name: thumbnailsAvailability
      TYPE: STRING
      REQUIRED: false
      comment: This value indicates whether thumbnail images have been generated for the video.
  VideoProcessingDetailsProcessingProgress:
    - name: partsProcessed
      TYPE: STRING
      REQUIRED: false
      FORMAT: uint64
      comment: "The number of parts of the video that YouTube has already processed. You can estimate the percentage of the video that YouTube has already processed by calculating: 100 * parts_processed / parts_total Note that since the estimated number of parts could increase without a corresponding increase in the number of parts that have already been processed, it is possible that the calculated progress could periodically decrease while YouTube processes a video."
    - name: partsTotal
      TYPE: STRING
      REQUIRED: false
      FORMAT: uint64
      comment: An estimate of the total number of parts that need to be processed for the video. The number may be updated with more precise estimates while YouTube processes the video.
    - name: timeLeftMs
      TYPE: STRING
      REQUIRED: false
      FORMAT: uint64
      comment: An estimate of the amount of time, in millseconds, that YouTube needs to finish processing the video.
  VideoProjectDetails:
    - name: value
      TYPE: ANY
      REQUIRED: false
  VideoRating:
    - name: rating
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - none
        - like
        - dislike
      comment: Rating of a video.
    - name: videoId
      TYPE: STRING
      REQUIRED: false
      comment: The ID that YouTube uses to uniquely identify the video.
  VideoRecordingDetails:
    - name: location
      TYPE: STRUCT(GeoPoint)
      REQUIRED: false
      comment: The geolocation information associated with the video.
    - name: locationDescription
      TYPE: STRING
      REQUIRED: false
      comment: The text description of the location where the video was recorded.
    - name: recordingDate
      TYPE: TIMESTAMP
      REQUIRED: false
      FORMAT: date-time
      comment: The date and time when the video was recorded.
  VideoSnippet:
    - name: tags
      TYPE: "[]STRING"
      REQUIRED: false
      comment: A list of keyword tags associated with the video. Tags may contain spaces.
    - name: categoryId
      TYPE: STRING
      REQUIRED: false
      comment: The YouTube video category associated with the video.
    - name: channelId
      TYPE: STRING
      REQUIRED: false
      comment: The ID that YouTube uses to uniquely identify the channel that the video was uploaded to.
    - name: channelTitle
      TYPE: STRING
      REQUIRED: false
      comment: Channel title for the channel that the video belongs to.
    - name: defaultAudioLanguage
      TYPE: STRING
      REQUIRED: false
      comment: The default_audio_language property specifies the language spoken in the video's default audio track.
    - name: defaultLanguage
      TYPE: STRING
      REQUIRED: false
      comment: The language of the videos's default snippet.
    - name: description
      TYPE: STRING
      REQUIRED: false
      comment: The video's description. @mutable youtube.videos.insert youtube.videos.update
    - name: liveBroadcastContent
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - none
        - upcoming
        - live
        - completed
      comment: Indicates if the video is an upcoming/active live broadcast. Or it's "none" if the video is not an upcoming/active live broadcast.
    - name: localized
      TYPE: STRUCT(VideoLocalization)
      REQUIRED: false
      comment: Localized snippet selected with the hl parameter. If no such localization exists, this field is populated with the default snippet. (Read-only)
    - name: publishedAt
      TYPE: TIMESTAMP
      REQUIRED: false
      FORMAT: date-time
      comment: The date and time when the video was uploaded.
    - name: thumbnails
      TYPE: STRUCT(ThumbnailDetails)
      REQUIRED: false
      comment: A map of thumbnail images associated with the video. For each object in the map, the key is the name of the thumbnail image, and the value is an object that contains other information about the thumbnail.
    - name: title
      TYPE: STRING
      REQUIRED: false
      comment: The video's title. @mutable youtube.videos.insert youtube.videos.update
  VideoStat:
    - name: contentDetails
      TYPE: STRUCT(VideoStatsContentDetails)
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. The VideoStatsContentDetails object contains information about the video content, including the length of the video.
    - name: etag
      TYPE: STRING
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. Etag of this resource.
    - name: id
      TYPE: STRING
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. The ID that YouTube uses to uniquely identify the video.
    - name: kind
      TYPE: STRING
      REQUIRED: false
      READ_ONLY: true
      comment: "Output only. Identifies what kind of resource this is. Value: the fixed string \"youtube#videoStats\"."
    - name: snippet
      TYPE: STRUCT(VideoStatsSnippet)
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. The VideoStatsSnippet object contains basic details about the video, such publish time.
    - name: statistics
      TYPE: STRUCT(VideoStatsStatistics)
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. The VideoStatsStatistics object contains statistics about the video.
  VideoStatistics:
    - name: commentCount
      TYPE: STRING
      REQUIRED: false
      FORMAT: uint64
      comment: The number of comments for the video.
    - name: dislikeCount
      TYPE: STRING
      REQUIRED: false
      FORMAT: uint64
      comment: The number of users who have indicated that they disliked the video by giving it a negative rating.
    - name: favoriteCount
      TYPE: STRING
      REQUIRED: false
      FORMAT: uint64
      DEPRECATED: true
      comment: The number of users who currently have the video marked as a favorite video.
    - name: likeCount
      TYPE: STRING
      REQUIRED: false
      FORMAT: uint64
      comment: The number of users who have indicated that they liked the video by giving it a positive rating.
    - name: viewCount
      TYPE: STRING
      REQUIRED: false
      FORMAT: uint64
      comment: The number of times the video has been viewed.
  VideoStatsContentDetails:
    - name: duration
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-duration
      READ_ONLY: true
      comment: Output only. The length of the video. The property value is a [`google.protobuf.Duration`](https://developers.google.com/protocol-buffers/docs/reference/google.protobuf#duration) object.
  VideoStatsSnippet:
    - name: publishTime
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-datetime
      READ_ONLY: true
      comment: Output only. The date and time that the video was uploaded. The property value is a [`google.protobuf.Timestamp`](https://developers.google.com/protocol-buffers/docs/reference/google.protobuf#timestamp) object.
  VideoStatsStatistics:
    - name: commentCount
      TYPE: STRING
      REQUIRED: false
      FORMAT: int64
      READ_ONLY: true
      comment: Output only. The number of comments for the video.
    - name: likeCount
      TYPE: STRING
      REQUIRED: false
      FORMAT: int64
      READ_ONLY: true
      comment: Output only. The number of users who have indicated that they liked the video by giving it a positive rating.
    - name: viewCount
      TYPE: STRING
      REQUIRED: false
      FORMAT: int64
      READ_ONLY: true
      comment: Output only. The number of times the video has been viewed.
  VideoStatus:
    - name: containsSyntheticMedia
      TYPE: BOOL
      REQUIRED: false
      comment: Indicates if the video contains altered or synthetic media.
    - name: embeddable
      TYPE: BOOL
      REQUIRED: false
      comment: This value indicates if the video can be embedded on another website. @mutable youtube.videos.insert youtube.videos.update
    - name: failureReason
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - conversion
        - invalidFile
        - emptyFile
        - tooSmall
        - codec
        - uploadAborted
      comment: This value explains why a video failed to upload. This property is only present if the uploadStatus property indicates that the upload failed.
    - name: license
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - youtube
        - creativeCommon
      comment: The video's license. @mutable youtube.videos.insert youtube.videos.update
    - name: madeForKids
      TYPE: BOOL
      REQUIRED: false
    - name: privacyStatus
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - public
        - unlisted
        - private
      comment: The video's privacy status.
    - name: publicStatsViewable
      TYPE: BOOL
      REQUIRED: false
      comment: This value indicates if the extended video statistics on the watch page can be viewed by everyone. Note that the view count, likes, etc will still be visible if this is disabled. @mutable youtube.videos.insert youtube.videos.update
    - name: publishAt
      TYPE: TIMESTAMP
      REQUIRED: false
      FORMAT: date-time
      comment: The date and time when the video is scheduled to publish. It can be set only if the privacy status of the video is private..
    - name: rejectionReason
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - copyright
        - inappropriate
        - duplicate
        - termsOfUse
        - uploaderAccountSuspended
        - length
        - claim
        - uploaderAccountClosed
        - trademark
        - legal
      comment: This value explains why YouTube rejected an uploaded video. This property is only present if the uploadStatus property indicates that the upload was rejected.
    - name: selfDeclaredMadeForKids
      TYPE: BOOL
      REQUIRED: false
    - name: uploadStatus
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - uploaded
        - processed
        - failed
        - rejected
        - deleted
      comment: The status of the uploaded video.
  VideoSuggestions:
    - name: editorSuggestions
      TYPE: "[]STRING"
      REQUIRED: false
      comment: A list of video editing operations that might improve the video quality or playback experience of the uploaded video.
    - name: processingErrors
      TYPE: "[]STRING"
      REQUIRED: false
      comment: A list of errors that will prevent YouTube from successfully processing the uploaded video video. These errors indicate that, regardless of the video's current processing status, eventually, that status will almost certainly be failed.
    - name: processingHints
      TYPE: "[]STRING"
      REQUIRED: false
      comment: A list of suggestions that may improve YouTube's ability to process the video.
    - name: processingWarnings
      TYPE: "[]STRING"
      REQUIRED: false
      comment: A list of reasons why YouTube may have difficulty transcoding the uploaded video or that might result in an erroneous transcoding. These warnings are generated before YouTube actually processes the uploaded video file. In addition, they identify issues that are unlikely to cause the video processing to fail but that might cause problems such as sync issues, video artifacts, or a missing audio track.
    - name: tagSuggestions
      TYPE: "[]STRUCT(VideoSuggestionsTagSuggestion)"
      REQUIRED: false
      comment: A list of keyword tags that could be added to the video's metadata to increase the likelihood that users will locate your video when searching or browsing on YouTube.
  VideoSuggestionsTagSuggestion:
    - name: categoryRestricts
      TYPE: "[]STRING"
      REQUIRED: false
      comment: A set of video categories for which the tag is relevant. You can use this information to display appropriate tag suggestions based on the video category that the video uploader associates with the video. By default, tag suggestions are relevant for all categories if there are no restricts defined for the keyword.
    - name: tag
      TYPE: STRING
      REQUIRED: false
      comment: The keyword tag suggested for the video.
  VideoTopicDetails:
    - name: relevantTopicIds
      TYPE: "[]STRING"
      REQUIRED: false
      comment: Similar to topic_id, except that these topics are merely relevant to the video. These are topics that may be mentioned in, or appear in the video. You can retrieve information about each topic using Freebase Topic API.
    - name: topicCategories
      TYPE: "[]STRING"
      REQUIRED: false
      comment: A list of Wikipedia URLs that provide a high-level description of the video's content.
    - name: topicIds
      TYPE: "[]STRING"
      REQUIRED: false
      comment: A list of Freebase topic IDs that are centrally associated with the video. These are topics that are centrally featured in the video, and it can be said that the video is mainly about each of these. You can retrieve information about each topic using the < a href="http://wiki.freebase.com/wiki/Topic_API">Freebase Topic API.
  VideoTrainability:
    - name: etag
      TYPE: STRING
      REQUIRED: false
      comment: Etag of this resource.
    - name: kind
      TYPE: STRING
      REQUIRED: false
      DEFAULT: youtube#videoTrainability
      comment: "Identifies what kind of resource this is. Value: the fixed string \"youtube#videoTrainability\"."
    - name: permitted
      TYPE: "[]STRING"
      REQUIRED: false
      comment: "Specifies who is allowed to train on the video. Valid values are: - a single string \"all\" - a single string \"none\" - a list of allowed parties"
    - name: videoId
