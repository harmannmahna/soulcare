    - name: postId
      TYPE: STRING
      REQUIRED: false
      comment: The ID of the post the comment refers to, if any.
    - name: publishedAt
      TYPE: TIMESTAMP
      REQUIRED: false
      FORMAT: date-time
      comment: The date and time when the comment was originally published.
    - name: textDisplay
      TYPE: STRING
      REQUIRED: false
      comment: The comment's text. The format is either plain text or HTML dependent on what has been requested. Even the plain text representation may differ from the text originally posted in that it may replace video links with video titles etc.
