STRUCTS:
  AbuseReport:
    - name: abuseTypes
      TYPE: "[]STRUCT(AbuseType)"
      REQUIRED: false
    - name: description
      TYPE: STRING
      REQUIRED: false
    - name: relatedEntities
      TYPE: "[]STRUCT(RelatedEntity)"
      REQUIRED: false
    - name: subject
      TYPE: STRUCT(Entity)
      REQUIRED: false
  AbuseType:
    - name: id
      TYPE: STRING
      REQUIRED: false
  AccessPolicy:
    - name: allowed
      TYPE: BOOL
      REQUIRED: false
      comment: The value of allowed indicates whether the access to the policy is allowed or denied by default.
    - name: exception
      TYPE: "[]STRING"
      REQUIRED: false
      comment: A list of region codes that identify countries where the default policy do not apply.
  Activity:
    - name: contentDetails
      TYPE: STRUCT(ActivityContentDetails)
      REQUIRED: false
      comment: The contentDetails object contains information about the content associated with the activity. For example, if the snippet.type value is videoRated, then the contentDetails object's content identifies the rated video.
    - name: etag
      TYPE: STRING
      REQUIRED: false
      comment: Etag of this resource
    - name: id
      TYPE: STRING
      REQUIRED: false
      comment: The ID that YouTube uses to uniquely identify the activity.
    - name: kind
      TYPE: STRING
      REQUIRED: false
      DEFAULT: youtube#activity
      comment: "Identifies what kind of resource this is. Value: the fixed string \"youtube#activity\"."
    - name: snippet
      TYPE: STRUCT(ActivitySnippet)
      REQUIRED: false
      comment: The snippet object contains basic details about the activity, including the activity's type and group ID.
  ActivityContentDetails:
    - name: bulletin
      TYPE: STRUCT(ActivityContentDetailsBulletin)
      REQUIRED: false
      comment: The bulletin object contains details about a channel bulletin post. This object is only present if the snippet.type is bulletin.
    - name: channelItem
      TYPE: STRUCT(ActivityContentDetailsChannelItem)
      REQUIRED: false
      comment: The channelItem object contains details about a resource which was added to a channel. This property is only present if the snippet.type is channelItem.
    - name: comment
      TYPE: STRUCT(ActivityContentDetailsComment)
      REQUIRED: false
      comment: The comment object contains information about a resource that received a comment. This property is only present if the snippet.type is comment.
    - name: favorite
      TYPE: STRUCT(ActivityContentDetailsFavorite)
      REQUIRED: false
      comment: The favorite object contains information about a video that was marked as a favorite video. This property is only present if the snippet.type is favorite.
    - name: like
      TYPE: STRUCT(ActivityContentDetailsLike)
      REQUIRED: false
      comment: The like object contains information about a resource that received a positive (like) rating. This property is only present if the snippet.type is like.
    - name: playlistItem
      TYPE: STRUCT(ActivityContentDetailsPlaylistItem)
      REQUIRED: false
      comment: The playlistItem object contains information about a new playlist item. This property is only present if the snippet.type is playlistItem.
    - name: promotedItem
      TYPE: STRUCT(ActivityContentDetailsPromotedItem)
      REQUIRED: false
      comment: The promotedItem object contains details about a resource which is being promoted. This property is only present if the snippet.type is promotedItem.
    - name: recommendation
      TYPE: STRUCT(ActivityContentDetailsRecommendation)
      REQUIRED: false
      comment: The recommendation object contains information about a recommended resource. This property is only present if the snippet.type is recommendation.
    - name: social
      TYPE: STRUCT(ActivityContentDetailsSocial)
      REQUIRED: false
      comment: The social object contains details about a social network post. This property is only present if the snippet.type is social.
    - name: subscription
      TYPE: STRUCT(ActivityContentDetailsSubscription)
      REQUIRED: false
      comment: The subscription object contains information about a channel that a user subscribed to. This property is only present if the snippet.type is subscription.
    - name: upload
      TYPE: STRUCT(ActivityContentDetailsUpload)
      REQUIRED: false
      comment: The upload object contains information about the uploaded video. This property is only present if the snippet.type is upload.
  ActivityContentDetailsBulletin:
    - name: resourceId
      TYPE: STRUCT(ResourceId)
      REQUIRED: false
      comment: The resourceId object contains information that identifies the resource associated with a bulletin post. @mutable youtube.activities.insert
  ActivityContentDetailsChannelItem:
    - name: resourceId
      TYPE: STRUCT(ResourceId)
      REQUIRED: false
      comment: The resourceId object contains information that identifies the resource that was added to the channel.
  ActivityContentDetailsComment:
    - name: resourceId
      TYPE: STRUCT(ResourceId)
      REQUIRED: false
      comment: The resourceId object contains information that identifies the resource associated with the comment.
  ActivityContentDetailsFavorite:
    - name: resourceId
      TYPE: STRUCT(ResourceId)
      REQUIRED: false
      comment: The resourceId object contains information that identifies the resource that was marked as a favorite.
  ActivityContentDetailsLike:
    - name: resourceId
      TYPE: STRUCT(ResourceId)
      REQUIRED: false
      comment: The resourceId object contains information that identifies the rated resource.
  ActivityContentDetailsPlaylistItem:
    - name: playlistId
      TYPE: STRING
      REQUIRED: false
      comment: The value that YouTube uses to uniquely identify the playlist.
    - name: playlistItemId
      TYPE: STRING
      REQUIRED: false
      comment: ID of the item within the playlist.
    - name: resourceId
      TYPE: STRUCT(ResourceId)
      REQUIRED: false
      comment: The resourceId object contains information about the resource that was added to the playlist.
  ActivityContentDetailsPromotedItem:
    - name: adTag
      TYPE: STRING
      REQUIRED: false
      comment: The URL the client should fetch to request a promoted item.
    - name: clickTrackingUrl
      TYPE: STRING
      REQUIRED: false
      comment: The URL the client should ping to indicate that the user clicked through on this promoted item.
    - name: creativeViewUrl
      TYPE: STRING
      REQUIRED: false
      comment: The URL the client should ping to indicate that the user was shown this promoted item.
    - name: ctaType
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - ctaTypeUnspecified
        - visitAdvertiserSite
      comment: The type of call-to-action, a message to the user indicating action that can be taken.
    - name: customCtaButtonText
      TYPE: STRING
      REQUIRED: false
      comment: The custom call-to-action button text. If specified, it will override the default button text for the cta_type.
    - name: descriptionText
      TYPE: STRING
      REQUIRED: false
      comment: The text description to accompany the promoted item.
    - name: destinationUrl
      TYPE: STRING
      REQUIRED: false
      comment: The URL the client should direct the user to, if the user chooses to visit the advertiser's website.
    - name: forecastingUrl
      TYPE: "[]STRING"
      REQUIRED: false
      comment: The list of forecasting URLs. The client should ping all of these URLs when a promoted item is not available, to indicate that a promoted item could have been shown.
    - name: impressionUrl
      TYPE: "[]STRING"
      REQUIRED: false
      comment: The list of impression URLs. The client should ping all of these URLs to indicate that the user was shown this promoted item.
    - name: videoId
      TYPE: STRING
      REQUIRED: false
      comment: The ID that YouTube uses to uniquely identify the promoted video.
  ActivityContentDetailsRecommendation:
    - name: reason
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - reasonUnspecified
        - videoFavorited
        - videoLiked
        - videoWatched
      comment: The reason that the resource is recommended to the user.
    - name: resourceId
      TYPE: STRUCT(ResourceId)
      REQUIRED: false
      comment: The resourceId object contains information that identifies the recommended resource.
    - name: seedResourceId
      TYPE: STRUCT(ResourceId)
      REQUIRED: false
      comment: The seedResourceId object contains information about the resource that caused the recommendation.
  ActivityContentDetailsSocial:
    - name: author
      TYPE: STRING
      REQUIRED: false
      comment: The author of the social network post.
    - name: imageUrl
      TYPE: STRING
      REQUIRED: false
      comment: An image of the post's author.
    - name: referenceUrl
      TYPE: STRING
      REQUIRED: false
      comment: The URL of the social network post.
    - name: resourceId
      TYPE: STRUCT(ResourceId)
      REQUIRED: false
      comment: The resourceId object encapsulates information that identifies the resource associated with a social network post.
    - name: type
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - unspecified
        - googlePlus
        - facebook
        - twitter
      comment: The name of the social network.
  ActivityContentDetailsSubscription:
    - name: resourceId
      TYPE: STRUCT(ResourceId)
      REQUIRED: false
      comment: The resourceId object contains information that identifies the resource that the user subscribed to.
  ActivityContentDetailsUpload:
    - name: videoId
      TYPE: STRING
      REQUIRED: false
      comment: The ID that YouTube uses to uniquely identify the uploaded video.
  ActivityListResponse:
    - name: etag
      TYPE: STRING
      REQUIRED: false
      comment: Etag of this resource.
    - name: eventId
      TYPE: STRING
      REQUIRED: false
      DEPRECATED: true
      comment: Serialized EventId of the request which produced this response.
    - name: items
      TYPE: "[]STRUCT(Activity)"
      REQUIRED: false
    - name: kind
      TYPE: STRING
      REQUIRED: false
      DEFAULT: youtube#activityListResponse
      comment: "Identifies what kind of resource this is. Value: the fixed string \"youtube#activityListResponse\"."
    - name: nextPageToken
      TYPE: STRING
      REQUIRED: false
      comment: The token that can be used as the value of the pageToken parameter to retrieve the next page in the result set.
    - name: pageInfo
      TYPE: STRUCT(PageInfo)
      REQUIRED: false
      comment: General pagination information.
