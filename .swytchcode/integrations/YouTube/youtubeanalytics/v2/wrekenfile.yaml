  Group:
    - name: contentDetails
      TYPE: STRUCT(GroupContentDetails)
      REQUIRED: false
      comment: The `contentDetails` object contains additional information about the group, such as the number and type of items that it contains.
    - name: errors
      TYPE: STRUCT(Errors)
      REQUIRED: false
      comment: Apiary error details
    - name: etag
      TYPE: STRING
      REQUIRED: false
