      TYPE: STRING
      REQUIRED: false
      ENUM:
        - PATH
        - OTHER
        - PARAMETER
  Errors:
    - name: code
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - BAD_REQUEST
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - GONE
        - PRECONDITION_FAILED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
      DEPRECATED: true
      comment: Global error code. Deprecated and ignored. Set custom error codes in ErrorProto.domain and ErrorProto.code instead.
    - name: error
      TYPE: "[]STRUCT(ErrorProto)"
      REQUIRED: false
      comment: Specific error description and codes
    - name: requestId
      TYPE: STRING
      REQUIRED: false
