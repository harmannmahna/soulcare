    - name: snippet
      TYPE: STRUCT(GroupSnippet)
      REQUIRED: false
      comment: The `snippet` object contains basic information about the group, including its creation date and name.
  GroupContentDetails:
    - name: itemCount
      TYPE: STRING
      REQUIRED: false
      FORMAT: uint64
      comment: The number of items in the group.
    - name: itemType
      TYPE: STRING
      REQUIRED: false
      comment: "The type of resources that the group contains. Valid values for this property are: * `youtube#channel` * `youtube#playlist` * `youtube#video` * `youtubePartner#asset`"
  GroupItem:
    - name: errors
      TYPE: STRUCT(Errors)
      REQUIRED: false
      comment: Apiary error details
    - name: etag
      TYPE: STRING
      REQUIRED: false
      comment: The Etag of this resource.
    - name: groupId
      TYPE: STRING
      REQUIRED: false
      comment: The ID that YouTube uses to uniquely identify the group that contains the item.
    - name: id
      TYPE: STRING
      REQUIRED: false
      comment: The ID that YouTube uses to uniquely identify the `channel`, `video`, `playlist`, or `asset` resource that is included in the group. Note that this ID refers specifically to the inclusion of that resource in a particular group and is different than the channel ID, video ID, playlist ID, or asset ID that uniquely identifies the resource itself. The `resource.id` property's value specifies the unique channel, video, playlist, or asset ID.
