VERSION: 2.0.2
DEFAULTS:
  bearer_token: BEARER <ACCESS_TOKEN>
  w_base_url: https://youtubereporting.googleapis.com
METHODS:
  youtubereporting.job.list:
    SUMMARY: Lists jobs.
    DESC: Lists jobs.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/jobs
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics-monetary.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics-monetary.readonly
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics.readonly
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - includeSystemManaged:
          TYPE: BOOL
          REQUIRED: false
          LOCATION: query
      - onBehalfOfContentOwner:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - pageSize:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - pageToken:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(ListJobsResponse)
        RETURNVAR: youtubereporting_job_list
        STATUS: 200
    CANONICAL_ID: youtubereporting.job.list
  youtubereporting.job.create:
    SUMMARY: Creates a job and returns it.
    DESC: Creates a job and returns it.
    HTTP:
      METHOD: POST
      ENDPOINT: /v1/jobs
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(Job)
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics-monetary.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics-monetary.readonly
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics.readonly
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - onBehalfOfContentOwner:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - body:
          TYPE: STRUCT(Job)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(Job)
        RETURNVAR: youtubereporting_job_create
        STATUS: 200
    CANONICAL_ID: youtubereporting.job.create
  youtubereporting.job.delete:
    SUMMARY: Deletes a job.
    DESC: Deletes a job.
    HTTP:
      METHOD: DELETE
      ENDPOINT: /v1/jobs/{jobId}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics-monetary.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics-monetary.readonly
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics.readonly
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - jobId:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - onBehalfOfContentOwner:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(Empty)
        RETURNVAR: youtubereporting_job_delete
        STATUS: 200
    CANONICAL_ID: youtubereporting.job.delete
  youtubereporting.job.get:
    SUMMARY: Gets a job.
    DESC: Gets a job.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/jobs/{jobId}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics-monetary.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics-monetary.readonly
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics.readonly
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - jobId:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - onBehalfOfContentOwner:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(Job)
        RETURNVAR: youtubereporting_job_get
        STATUS: 200
    CANONICAL_ID: youtubereporting.job.get
  youtubereporting.report.get:
    SUMMARY: Lists reports created by a specific job
    DESC: Lists reports created by a specific job. Returns NOT_FOUND if the job does not exist.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/jobs/{jobId}/reports
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics-monetary.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics-monetary.readonly
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics.readonly
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - jobId:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - createdAfter:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - onBehalfOfContentOwner:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - pageSize:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - pageToken:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - startTimeAtOrAfter:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - startTimeBefore:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(ListReportsResponse)
        RETURNVAR: youtubereporting_report_get
        STATUS: 200
    CANONICAL_ID: youtubereporting.report.get
  youtubereporting.report.get1:
    SUMMARY: Gets the metadata of a specific report.
    DESC: Gets the metadata of a specific report.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/jobs/{jobId}/reports/{reportId}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics-monetary.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics-monetary.readonly
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics.readonly
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - jobId:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - reportId:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - onBehalfOfContentOwner:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(Report)
        RETURNVAR: youtubereporting_report_get1
        STATUS: 200
    CANONICAL_ID: youtubereporting.report.get1
  youtubereporting.media.get:
    SUMMARY: Method for media download
    DESC: Method for media download. Download is supported on the URI `/v1/media/{+name}?alt=media`.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/media/{+resourceName}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics-monetary.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics-monetary.readonly
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics.readonly
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - resourceName:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(GdataMedia)
        RETURNVAR: youtubereporting_media_get
        STATUS: 200
    CANONICAL_ID: youtubereporting.media.get
  youtubereporting.reporttype.list:
    SUMMARY: Lists report types.
    DESC: Lists report types.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/reportTypes
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics-monetary.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics-monetary.readonly
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/yt-analytics.readonly
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - includeSystemManaged:
          TYPE: BOOL
          REQUIRED: false
          LOCATION: query
      - onBehalfOfContentOwner:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - pageSize:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - pageToken:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(ListReportTypesResponse)
        RETURNVAR: youtubereporting_reporttype_list
        STATUS: 200
    CANONICAL_ID: youtubereporting.reporttype.list
