  GdataObjectId:
    - name: bucketName
      TYPE: STRING
      REQUIRED: false
      comment: gdata
    - name: generation
      TYPE: STRING
      REQUIRED: false
      FORMAT: int64
      comment: gdata
    - name: objectName
      TYPE: STRING
      REQUIRED: false
      comment: gdata
  Job:
    - name: createTime
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-datetime
      comment: The creation date/time of the job.
    - name: expireTime
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-datetime
      comment: The date/time when this job will expire/expired. After a job expired, no new reports are generated.
    - name: id
      TYPE: STRING
      REQUIRED: false
      comment: The server-generated ID of the job (max. 40 characters).
    - name: name
      TYPE: STRING
      REQUIRED: false
      comment: The name of the job (max. 100 characters).
    - name: reportTypeId
      TYPE: STRING
      REQUIRED: false
      comment: The type of reports this job creates. Corresponds to the ID of a ReportType.
    - name: systemManaged
      TYPE: BOOL
      REQUIRED: false
      comment: True if this a system-managed job that cannot be modified by the user; otherwise false.
  ListJobsResponse:
    - name: jobs
      TYPE: "[]STRUCT(Job)"
      REQUIRED: false
      comment: The list of jobs.
    - name: nextPageToken
      TYPE: STRING
      REQUIRED: false
      comment: A token to retrieve next page of results. Pass this value in the ListJobsRequest.page_token field in the subsequent call to `ListJobs` method to retrieve the next page of results.
  ListReportTypesResponse:
    - name: nextPageToken
      TYPE: STRING
      REQUIRED: false
      comment: A token to retrieve next page of results. Pass this value in the ListReportTypesRequest.page_token field in the subsequent call to `ListReportTypes` method to retrieve the next page of results.
    - name: reportTypes
      TYPE: "[]STRUCT(ReportType)"
      REQUIRED: false
      comment: The list of report types.
  ListReportsResponse:
    - name: nextPageToken
      TYPE: STRING
      REQUIRED: false
      comment: A token to retrieve next page of results. Pass this value in the ListReportsRequest.page_token field in the subsequent call to `ListReports` method to retrieve the next page of results.
    - name: reports
      TYPE: "[]STRUCT(Report)"
      REQUIRED: false
      comment: The list of report types.
  Report:
    - name: createTime
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-datetime
      comment: The date/time when this report was created.
    - name: downloadUrl
      TYPE: STRING
      REQUIRED: false
      comment: The URL from which the report can be downloaded (max. 1000 characters).
    - name: endTime
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-datetime
      comment: The end of the time period that the report instance covers. The value is exclusive.
    - name: id
      TYPE: STRING
      REQUIRED: false
      comment: The server-generated ID of the report.
    - name: jobExpireTime
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-datetime
      comment: The date/time when the job this report belongs to will expire/expired.
    - name: jobId
      TYPE: STRING
      REQUIRED: false
      comment: The ID of the job that created this report.
    - name: startTime
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-datetime
      comment: The start of the time period that the report instance covers. The value is inclusive.
  ReportType:
    - name: deprecateTime
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-datetime
      comment: The date/time when this report type was/will be deprecated.
    - name: id
      TYPE: STRING
      REQUIRED: false
      comment: The ID of the report type (max. 100 characters).
    - name: name
      TYPE: STRING
      REQUIRED: false
      comment: The name of the report type (max. 100 characters).
    - name: systemManaged
      TYPE: BOOL
      REQUIRED: false
      comment: True if this a system-managed report type; otherwise false. Reporting jobs for system-managed report types are created automatically and can thus not be used in the `CreateJob` method.
