        - INLINE
        - GET_MEDIA
        - COMPOSITE_MEDIA
        - BIGSTORE_REF
        - DIFF_VERSION_RESPONSE
        - DIFF_CHECKSUMS_RESPONSE
        - DIFF_DOWNLOAD_RESPONSE
        - DIFF_UPLOAD_REQUEST
        - DIFF_UPLOAD_RESPONSE
